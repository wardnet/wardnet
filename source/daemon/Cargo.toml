[workspace]
members = [
    "crates/wardnet-postupgrade",
    "crates/wardnet-postupgrade-runner",
    "crates/wardnet-test-agent",
    "crates/wardnet-test-support",
    "crates/wardnet-common",
    "crates/wardnetd",
    "crates/wardnetd-api",
    "crates/wardnetd-data",
    "crates/wardnetd-mock",
    "crates/wardnetd-services",
    "crates/wctl",
]
# The fuzz harness is its own workspace — libfuzzer-sys + nightly
# sanitizer rustflags must not leak into normal daemon builds.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.96"
# GPL-3.0-or-later, not MIT: the daemon links `rustables` (GPL-3.0-or-later,
# never published under any other license), and Rust links statically — so the
# compiled binary is a combined work GPL-3.0's terms extend to. The SDK and web
# UI stay MIT; see LICENSING.md at the repo root.
license = "GPL-3.0-or-later"
# None of these crates go to crates.io — the daemon ships as a Debian package
# and a container image. Declaring it keeps `cargo publish` from firing by
# accident, and lets cargo-deny's `allow-wildcard-paths` apply to our internal
# `{ path = ... }` dependencies (it doesn't for publishable crates, since
# crates.io forbids path deps outright).
publish = false

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Internal
wardnet-common = { path = "crates/wardnet-common" }
wardnet-postupgrade = { path = "crates/wardnet-postupgrade" }
wardnet-test-support = { path = "crates/wardnet-test-support" }
wardnetd-api = { path = "crates/wardnetd-api" }
wardnetd-data = { path = "crates/wardnetd-data" }
wardnetd-mock = { path = "crates/wardnetd-mock" }
wardnetd-services = { path = "crates/wardnetd-services" }

# https://crates.io/crates/serde
serde = { version = "1.0", features = ["derive"] }
# https://crates.io/crates/serde_json
serde_json = "1.0"

# https://crates.io/crates/uuid
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# https://crates.io/crates/chrono
chrono = { version = "0.4", features = ["serde"] }

# https://crates.io/crates/thiserror
thiserror = "2"
# https://crates.io/crates/tracing
tracing = "0.1"

# https://crates.io/crates/tokio
tokio = { version = "1", features = ["full"] }
# https://crates.io/crates/axum
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
# https://crates.io/crates/tokio-tungstenite — persistent client WebSocket for the
# reverse-tunnel client to wardnet-cloud's Tunneller (issue #809). Pinned to the
# same 0.29 axum's `ws` feature already resolves transitively (one version only).
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-webpki-roots"] }
# https://crates.io/crates/axum-extra
axum-extra = { version = "0.12", features = ["typed-header", "cookie", "query"] }

# https://crates.io/crates/sqlx
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "uuid", "chrono", "migrate"] }

# https://crates.io/crates/tower
tower = { version = "0.5", features = ["util"] }
# https://crates.io/crates/tower-http
tower-http = { version = "0.6", features = ["catch-panic", "trace"] }

# https://crates.io/crates/rust-embed
rust-embed = { version = "8", features = ["axum"] }
# https://crates.io/crates/toml
toml = "1.1"

# https://crates.io/crates/tracing-subscriber
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# https://crates.io/crates/tracing-appender
tracing-appender = "0.2"

# https://crates.io/crates/argon2
# `std` pulls in argon2 -> password-hash/std -> rand_core/std, which is what
# enables `OsRng` (used by `SaltString::generate`). Until sqlx 0.9 the
# `getrandom` flag on the shared rand_core 0.6 was set transitively by sqlx
# 0.8's rsa/signature deps; sqlx 0.9 dropped them, so we enable it explicitly
# through argon2's own feature here.
argon2 = { version = "0.5", features = ["std"] }
# https://crates.io/crates/anyhow
anyhow = "1"
# https://crates.io/crates/rand
rand = "0.10"
# https://crates.io/crates/base64
base64 = "0.22"

# https://crates.io/crates/sha2
sha2 = "0.11"
# https://crates.io/crates/hex
hex = "0.4"
# https://crates.io/crates/ed25519-dalek — Ed25519 keygen + signing for DDNS
# bridge registration and authenticated request signing. The signing key never
# leaves the Pi. `std` implies the `signature` feature; keys are built from
# random seed bytes via `SigningKey::from_bytes`, so the `rand_core` feature
# (which pins an older rand_core than the workspace `rand`) is not needed.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# https://crates.io/crates/x25519-dalek — Curve25519 / X25519 keygen for the
# inbound WireGuard server + per-peer keypairs (issue #809). Uses the `x25519`
# free function + base-point constant, so no `static_secrets` feature is needed;
# clamping is applied to match `wg genkey`.
x25519-dalek = { version = "3", default-features = false }
# https://crates.io/crates/web-push-native — HTTP-agnostic Web Push: RFC 8291 /
# RFC 8188 payload encryption via RustCrypto, no OpenSSL/isahc. Returns request
# headers + encrypted body; we POST with the workspace `reqwest`. The default
# `vapid` feature stays OFF: it drags in jwt-simple → superboring → `rsa`
# (RUSTSEC-2023-0071, Marvin timing sidechannel) just to mint a two-claim ES256
# token, so push/sender.rs signs the VAPID JWT directly with the re-exported
# `p256` instead.
web-push-native = { version = "0.4", default-features = false }
# https://crates.io/crates/http — name the `http::Request` web-push-native emits
# so we can marshal it onto the reqwest client. Same version reqwest 0.12 uses.
http = "1"
# https://crates.io/crates/mime_guess
mime_guess = "2"

# https://crates.io/crates/clap
clap = { version = "4", features = ["derive"] }
# https://crates.io/crates/reqwest
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls", "stream"] }
# https://crates.io/crates/async-trait
async-trait = "0.1"
# https://crates.io/crates/wireguard-control
wireguard-control = "2"
# https://crates.io/crates/ipnetwork
# 0.21 to match the ipnetwork version rustables 0.8.8 exposes in its
# `Rule::snetwork`/`dnetwork` signatures, so the two unify to one type.
ipnetwork = "0.21"
# https://crates.io/crates/ipnet — the CIDR type dhcproto's option 121 uses
ipnet = "2"
# https://crates.io/crates/tokio-util
tokio-util = { version = "0.7", features = ["rt"] }
# https://crates.io/crates/arc-swap — atomic Arc replacement for hot-path filter cache
arc-swap = "1"
# https://crates.io/crates/pnet
pnet = "0.35"
# https://crates.io/crates/sysinfo
sysinfo = "0.39"
# https://crates.io/crates/dhcproto
dhcproto = "0.15"

# https://crates.io/crates/regex
regex = "1"
# https://crates.io/crates/mdns-sd — pure-Rust mDNS responder; advertises wardnet.local for setup discovery
mdns-sd = "0.20"
# https://crates.io/crates/semver — SemVer parsing and ordering for auto-update version comparison
semver = { version = "1", features = ["serde"] }
# https://crates.io/crates/flate2 — gzip decompression for release tarballs
flate2 = "1"
# https://crates.io/crates/tar — tarball extraction for release artefacts
tar = "0.4"
# https://crates.io/crates/minisign-verify — verify minisign signatures on release artefacts
minisign-verify = "0.2"
# https://crates.io/crates/minisign — sign + keygen, used only by tests that need to forge signatures over synthetic payloads
minisign = { version = "0.9", default-features = false }
# https://crates.io/crates/libc — used by wardnet-postupgrade-runner for memfd_create + fexecve syscalls
libc = "0.2"
# https://crates.io/crates/age — symmetric passphrase encryption for backup bundles (scrypt KDF + ChaCha20-Poly1305)
age = { version = "0.12", default-features = false }
# https://crates.io/crates/futures
futures = "0.3"
# https://crates.io/crates/tokio-stream — ReceiverStream adapter used by SSE handlers
tokio-stream = { version = "0.1", features = ["sync"] }
# https://crates.io/crates/cron
cron = "0.16"

# https://crates.io/crates/criterion — benchmark harness (dev-only). We disable
# default features (plotters/gnuplot/rayon) and keep only cargo_bench_support:
# criterion still writes target/criterion/**/estimates.json, which the `cubit`
# tool ingests, without pulling the plotting stack into the dev build.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

# https://crates.io/crates/hickory-proto
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }
# https://crates.io/crates/hickory-resolver
# DNS Stage 4: tls-ring/https-ring enable DoT/DoH upstreams; dnssec-ring
# enables ResolverOpts.validate; webpki-roots bundles Mozilla roots so the
# appliance can verify upstream DoT/DoH certs without a system trust store.
# DNS Stage 5: `recursor` enables hickory_resolver::recursor::Recursor (the
# standalone hickory-recursor crate was folded into hickory-resolver).
hickory-resolver = { version = "0.26", features = [
    "tls-ring",
    "https-ring",
    "dnssec-ring",
    "webpki-roots",
    "recursor",
] }
# https://crates.io/crates/socket2 — raw socket2 wrapper used to set
# SO_BINDTODEVICE on per-tunnel DNS upstream sockets so tunneled-device
# queries egress via the tunnel interface instead of leaking to the ISP.
socket2 = { version = "0.6", features = ["all"] }

# https://crates.io/crates/surge-ping — async ICMP echo with SO_BINDTODEVICE
# support, used by the per-tunnel latency prober to measure RTT through
# a specific tunnel interface.
surge-ping = "0.9"
# https://crates.io/crates/rtnetlink
rtnetlink = "0.21"
# https://crates.io/crates/netlink-packet-route
netlink-packet-route = "0.31"
# https://crates.io/crates/netlink-sys
netlink-sys = "0.8"
# https://crates.io/crates/rustables — pure-Rust nftables over netlink (no nft
# CLI). build.rs runs bindgen against <linux/netfilter/nf_tables.h>, so the
# BUILD env needs clang/libclang + kernel uapi headers; nothing C links at
# runtime. Replaces the former `nft` shell-out (issue #307).
rustables = "0.8.8"

# https://crates.io/crates/opentelemetry
opentelemetry = "0.32"
# https://crates.io/crates/opentelemetry_sdk
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
# https://crates.io/crates/opentelemetry-otlp
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "logs", "metrics"] }
# https://crates.io/crates/tracing-opentelemetry
tracing-opentelemetry = "0.33"
# https://crates.io/crates/opentelemetry-appender-tracing
opentelemetry-appender-tracing = "0.32"

# https://crates.io/crates/pyroscope
pyroscope = { version = "2", features = ["backend-pprof-rs"] }

# https://crates.io/crates/utoipa
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
# https://crates.io/crates/utoipa-axum
utoipa-axum = "0.2"

# https://crates.io/crates/axum-server — TLS-terminating server with in-memory
# RustlsConfig hot-reload (lock-free cert swap on ACME renewal).
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
# https://crates.io/crates/instant-acme — async ACME (RFC 8555) client for
# DNS-01 certificate issuance; bundles its own hyper-rustls transport.
instant-acme = "0.8.5"
# https://crates.io/crates/rcgen — generate the placeholder self-signed cert
# (pre-provisioning :443) and the ACME CSR + leaf keypair.
rcgen = "0.14.8"
# https://crates.io/crates/x509-parser — parse `not_after` from the issued
# chain to schedule renewal.
x509-parser = "0.18"
# https://crates.io/crates/cms — CMS SignedData types that wrap the iOS
# `.mobileconfig` so Apple shows "Verified" (issue #914). Pure-Rust RustCrypto
# stack (der/spki/x509-cert), no OpenSSL. The `builder` feature is deliberately
# OFF: it drags in `rsa` (RUSTSEC-2023-0071, Marvin timing sidechannel) for RSA
# signing we never do, so the SignedData is assembled from the base types and
# signed with `p256` directly — the same reason the web-push `vapid` feature is
# disabled above.
cms = { version = "0.2.3", default-features = false, features = ["std", "alloc"] }
# https://crates.io/crates/x509-cert — parse the issued chain into the DER
# certificate + issuer/serial the CMS signer embeds.
x509-cert = { version = "0.2", features = ["pem"] }
# https://crates.io/crates/p256 — sign the CMS SignerInfo with the leaf's
# ECDSA P-256 key (rcgen generates a P-256 leaf), matching the cert's algorithm.
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
# https://crates.io/crates/der — encode the `.mobileconfig` bytes as the CMS
# encapsulated content (OctetString → Any).
der = { version = "0.7", features = ["oid"] }
# https://crates.io/crates/const-oid — the id-data / SHA-256 OIDs the CMS
# structure references.
const-oid = "0.9"
# https://crates.io/crates/spki — the SHA-256 AlgorithmIdentifier for the CMS
# digest algorithms set.
spki = "0.7"
# https://crates.io/crates/rustls — install the aws-lc-rs crypto provider as the
# process default for :443 TLS (both ring + aws-lc-rs are in the tree, so rustls
# 0.23 can't auto-pick).
rustls = { version = "0.23", features = ["aws_lc_rs"] }
# https://crates.io/crates/tokio-rustls — async TLS acceptor for the DoT :853
# listener (issue #912); same 0.26 the tree already resolves via axum-server.
tokio-rustls = "0.26"
# https://crates.io/crates/sd-notify — pure-Rust sd_notify(3): READY=1 +
# WATCHDOG=1 for the Type=notify unit and the health-gated soft watchdog
# (issue #214). No libsystemd C dependency; a graceful no-op when
# NOTIFY_SOCKET is unset (dev / mock).
sd-notify = "0.5"

# https://crates.io/crates/tempfile
tempfile = "=3.27"
# https://crates.io/crates/wiremock — mock HTTP server for DDNS provider tests
# (mock bridge + mock Cloudflare). Dev/test only.
wiremock = "0.6"
