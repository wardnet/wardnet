[package]
name = "wardnetd-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Internal
wardnet-common.workspace = true

# https://crates.io/crates/tokio
tokio.workspace = true
# https://crates.io/crates/sqlx
sqlx.workspace = true
# https://crates.io/crates/serde
serde.workspace = true
# https://crates.io/crates/serde_json
serde_json.workspace = true
# https://crates.io/crates/uuid
uuid.workspace = true
# https://crates.io/crates/chrono
chrono.workspace = true
# https://crates.io/crates/tracing
tracing.workspace = true
# https://crates.io/crates/argon2 — its `std` feature (set in the workspace)
# activates `getrandom` on rand_core so `OsRng` is available for password hashing.
argon2.workspace = true
# https://crates.io/crates/anyhow
anyhow.workspace = true
# https://crates.io/crates/toml
toml.workspace = true
# https://crates.io/crates/async-trait
async-trait.workspace = true
# https://crates.io/crates/futures — streaming the blocklist-domain load row
# by row (`BoxStream`) so a ~2.2M-domain feed never materialises as an
# intermediate `Vec` before the filter set is built.
futures.workspace = true
# https://crates.io/crates/libc — statvfs(3) for the startup-VACUUM disk-space guard
libc.workspace = true

[dev-dependencies]
# https://crates.io/crates/tokio
tokio = { workspace = true, features = ["test-util"] }
# In-memory log capture so tests can assert on rendered message text, not just
# structured fields.
wardnet-test-support.workspace = true
