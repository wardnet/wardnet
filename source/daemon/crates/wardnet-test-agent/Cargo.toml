[package]
name = "wardnet-test-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# https://crates.io/crates/tokio
tokio.workspace = true
# https://crates.io/crates/axum
axum.workspace = true
# https://crates.io/crates/serde
serde.workspace = true
# https://crates.io/crates/serde_json
serde_json.workspace = true
# https://crates.io/crates/tracing
tracing.workspace = true
# https://crates.io/crates/tracing-subscriber
tracing-subscriber.workspace = true
# https://crates.io/crates/clap
clap.workspace = true
# https://crates.io/crates/regex
regex.workspace = true
# https://crates.io/crates/reqwest
# Forwards HTTP from a LAN client to the daemon for the `POST /proxy`
# route, binding the caller's source IP so wardnetd classifies the
# request as that device (source-IP identity for the /devices/me flows).
reqwest.workspace = true
# https://crates.io/crates/anyhow
anyhow.workspace = true
# https://crates.io/crates/pnet
# Drives raw ARP traffic from the test-agent container's host
# interface for the GARP-failover e2e (issue #213). The crate is
# already a workspace dep used by `wardnetd`'s pnet-based
# packet-capture and probe paths.
pnet.workspace = true
# https://crates.io/crates/libc
# Delivers SIGSTOP/SIGCONT to the daemon via the `kill(2)` syscall for the
# watchdog e2e (issue #214). The minimal daemon container has no `kill`
# binary, so we signal in-process rather than spawning one.
libc.workspace = true
# https://crates.io/crates/sha2
# Digests /usr/local/bin/wardnetd and its `.old` sibling for the
# auto-update swap e2e (issue #319). Comparing digests is what proves a
# swap actually replaced the binary — size and mtime both survive a
# no-op rename.
sha2.workspace = true
# https://crates.io/crates/hex
# Renders the sha2 digests above as the hex strings the specs compare.
hex.workspace = true
