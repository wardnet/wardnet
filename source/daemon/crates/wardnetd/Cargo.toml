rustables.workspace = true
# https://crates.io/crates/regex
regex.workspace = true
# https://crates.io/crates/cron
cron.workspace = true
# https://crates.io/crates/mdns-sd — mDNS responder advertising wardnet.local for setup discovery
mdns-sd.workspace = true
# https://crates.io/crates/surge-ping — async ICMP echo with SO_BINDTODEVICE for per-tunnel latency probe
