# https://crates.io/crates/axum-server — TLS-terminating :443 listener with hot cert reload
axum-server.workspace = true
# https://crates.io/crates/rcgen — placeholder self-signed cert seeding the :443 RustlsConfig at boot
rcgen.workspace = true
# https://crates.io/crates/rustls — install the aws-lc-rs crypto provider as process default
rustls.workspace = true

[dev-dependencies]
# https://crates.io/crates/tokio
tokio = { workspace = true, features = ["test-util"] }
# https://crates.io/crates/tempfile
tempfile.workspace = true
