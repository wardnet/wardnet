[package]
name = "wardnetd-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Exposes the synchronous core of AgeArchiver::unpack for fuzz harnesses.
# NEVER enable this in production builds — calling the sync path from
# async code will block the tokio runtime. The flag exists so
# source/daemon/fuzz/ can skip the spawn_blocking + buffer clone that
# the public async API pays per call.
fuzz-internals = []

[dependencies]
# Internal
wardnet-common.workspace = true
wardnetd-data.workspace = true

# https://crates.io/crates/tokio
tokio.workspace = true
# https://crates.io/crates/tokio-util
tokio-util.workspace = true
# https://crates.io/crates/arc-swap — atomic Arc replacement for hot-path filter cache
arc-swap.workspace = true
# https://crates.io/crates/axum
axum.workspace = true
# https://crates.io/crates/tokio-tungstenite — persistent reverse-tunnel WS client
# to the cloud Tunneller (issue #809); the only holder of a long-lived connection.
tokio-tungstenite.workspace = true
# https://crates.io/crates/tower
tower.workspace = true
# https://crates.io/crates/sqlx
sqlx.workspace = true
# https://crates.io/crates/serde
serde.workspace = true
# https://crates.io/crates/serde_json
serde_json.workspace = true
# https://crates.io/crates/uuid
uuid.workspace = true
# https://crates.io/crates/chrono
chrono.workspace = true
# https://crates.io/crates/tracing
tracing.workspace = true
# https://crates.io/crates/tracing-subscriber
tracing-subscriber.workspace = true
# https://crates.io/crates/argon2
argon2.workspace = true
# https://crates.io/crates/anyhow
anyhow.workspace = true
# https://crates.io/crates/thiserror
thiserror.workspace = true
# https://crates.io/crates/async-trait
async-trait.workspace = true
# https://crates.io/crates/futures — concurrent health-check fan-out (join_all)
futures.workspace = true
# https://crates.io/crates/base64
base64.workspace = true
# https://crates.io/crates/sha2
sha2.workspace = true
# https://crates.io/crates/hex
hex.workspace = true
# https://crates.io/crates/ed25519-dalek — Ed25519 keygen + signing for DDNS bridge registration
ed25519-dalek.workspace = true
# https://crates.io/crates/x25519-dalek — X25519 keygen for the inbound WireGuard server + peers (#809)
x25519-dalek.workspace = true
# https://crates.io/crates/rand
rand.workspace = true
# https://crates.io/crates/reqwest
reqwest.workspace = true
# https://crates.io/crates/ipnetwork
ipnetwork.workspace = true
# https://crates.io/crates/sysinfo
sysinfo.workspace = true
# https://crates.io/crates/cron
cron.workspace = true
# https://crates.io/crates/regex
regex.workspace = true
# https://crates.io/crates/hickory-proto
hickory-proto.workspace = true
# https://crates.io/crates/semver — version comparison for auto-update
semver.workspace = true
# https://crates.io/crates/minisign-verify — signature verification for release tarballs
minisign-verify.workspace = true
# https://crates.io/crates/flate2 — gzip for release tarballs and backup bundles
flate2.workspace = true
# https://crates.io/crates/tar — tar layer for release artefacts and backup bundles
tar.workspace = true
# https://crates.io/crates/age — symmetric passphrase encryption for backup bundles
age.workspace = true
# https://crates.io/crates/instant-acme — ACME DNS-01 certificate issuance
instant-acme.workspace = true
# https://crates.io/crates/rcgen — ACME CSR + leaf keypair generation
rcgen.workspace = true
# https://crates.io/crates/x509-parser — parse cert `not_after` for renewal scheduling
x509-parser.workspace = true
# https://crates.io/crates/cms — CMS SignedData for the signed iOS `.mobileconfig` (#914)
cms.workspace = true
# https://crates.io/crates/x509-cert — parse the leaf chain for the CMS signer + certificates set
x509-cert.workspace = true
# https://crates.io/crates/p256 — sign the CMS SignerInfo with the leaf's ECDSA P-256 key
p256.workspace = true
# https://crates.io/crates/der — encode the profile bytes as the CMS encapsulated content
der.workspace = true
# https://crates.io/crates/const-oid — id-data / SHA-256 OIDs for the CMS structure
const-oid.workspace = true
# https://crates.io/crates/spki — SHA-256 / ECDSA AlgorithmIdentifiers for the CMS structure
spki.workspace = true
# https://crates.io/crates/web-push-native — Web Push encryption + VAPID signing
web-push-native.workspace = true
# https://crates.io/crates/http — name the http::Request web-push-native returns
http.workspace = true

[dev-dependencies]
# https://crates.io/crates/tokio
tokio = { workspace = true, features = ["test-util"] }
# https://crates.io/crates/minisign — keygen + signing, used by tests that build synthetic signed-tarball fixtures
minisign.workspace = true
# https://crates.io/crates/tempfile
tempfile.workspace = true
# https://crates.io/crates/wiremock — mock bridge + mock Cloudflare HTTP servers for DDNS provider tests
wiremock.workspace = true
# https://crates.io/crates/criterion — micro-benchmark harness for the DNS component benches (see benches/)
criterion.workspace = true

# Micro-benchmarks for the hot DNS components (cache, and later authoritative
# view + filter). `harness = false` hands the binary's main() to criterion.
# Output lands in target/criterion/**/estimates.json for the `cubit` tool.
[[bench]]
name = "dns_components"
harness = false
