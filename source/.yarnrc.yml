approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# The design system (@wardnet/{ui,styles,brand}) is consumed from GitHub
# Packages. GitHub Packages requires a token for every read, so route the
# scope and authenticate via GH_TOKEN — exported per-repo by direnv locally
# (needs `gh auth refresh -s read:packages` once) and set from GITHUB_TOKEN in
# CI. In-repo @wardnet packages (web, js, the apps) keep resolving locally:
# the workspace: protocol short-circuits the registry.
npmScopes:
  wardnet:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmAuthToken: "${GH_TOKEN-}"

# Yarn's minimal-release-age gate (default 1440 min) quarantines packages
# published in the last day — supply-chain protection against freshly
# compromised third-party releases. Our own first-party design-system packages
# are trusted and must install the moment they're released, so allowlist the
# @wardnet scope out of the age check (third-party deps stay gated).
npmPreapprovedPackages:
  - "@wardnet/*"
