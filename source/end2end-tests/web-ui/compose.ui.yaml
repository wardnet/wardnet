# Web-UI end-to-end test topology (Playwright).
#
# A dedicated, self-seeded daemon (`wardnetd-ui`) built with the real
# embedded frontends (`WEB_DIST=real`), driven by two Playwright runners:
#   - `ui_runner` on wardnet_mgmt — the admin-site + admin-app projects.
#   - `ui_runner_lan` on wardnet_lan + wardnet_mgmt — the device-keyed
#     user-app project (C1, #626). It reaches the daemon through a
#     LAN-side TLS proxy (`tls_proxy_lan`) whose own LAN IP is seeded as a
#     discovered device, so `GET /api/devices/me` (classified by source
#     IP) resolves non-null; the null case is exercised by navigating to
#     the mgmt proxy origin.
# Deliberately separate from the API/kernel Vitest stack
# (../daemon/compose.yaml): different project name + its own daemon + its
# own seeded state, so the two suites never couple.
#
# Networks mirror the daemon stack; `make` runs the two suites
# sequentially (each tears its stack down), so the shared subnets don't
# collide.

name: wardnet-e2e-web-ui

services:
  wardnetd-ui:
    build:
      context: ../../..
      dockerfile: source/daemon/Dockerfile.test
      args:
        # Embed the real built frontends (run `make build-web` first) so
        # the browser gets the actual apps, not the API suite's empties.
        WEB_DIST: real
    image: ${WARDNETD_UI_TEST_IMAGE:-wardnetd:dev-test-ui}
    # systemd-as-PID-1 recipe — identical to the daemon stack's wardnetd
    # service (see ../daemon/compose.yaml for the full rationale).
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    cgroup: host
    environment:
      container: docker
    tty: true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - wardnet_ui_state:/var/lib/wardnet
      # Reuse the daemon stack's journald + debug-logging drop-ins so
      # wardnetd's startup output reaches `compose logs`.
      - ../daemon/fixtures/systemd/journald-forward.conf:/etc/systemd/journald.conf.d/forward-console.conf:ro
      - ../daemon/fixtures/systemd/wardnetd-debug-logging.conf:/etc/systemd/system/wardnetd.service.d/debug-logging.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command:
      - bash
      - -c
      - |
        set +e
        chown -R wardnet:wardnet /var/lib/wardnet 2>&1 || true
        chmod 750 /var/lib/wardnet 2>&1 || true
        # Pin lan_interface to whichever NIC Docker gave the wardnet_lan
        # IP (10.91.0.1); the eth0 hardcode is right only by luck.
        LAN_IFACE=$$(ip -o -4 addr show | awk '/inet 10\.91\.0\.1\//{print $$2; exit}')
        if [ -n "$$LAN_IFACE" ]; then
          sed -i "s|^lan_interface = .*|lan_interface = \"$$LAN_IFACE\"|" /etc/wardnet/wardnet.toml
          echo "wardnetd-ui e2e fixture: pinned lan_interface=$$LAN_IFACE" >&2
        else
          echo "wardnetd-ui e2e fixture: WARNING no NIC holds 10.91.0.1; leaving lan_interface as-is" >&2
        fi
        # Point the NordVPN provider at the nordvpn_mock container instead of
        # the real api.nordvpn.com (issue #248), so the admin-site providers
        # spec can drive the wizard offline. Mirrors ../daemon/compose.yaml:
        # idempotent on the nordvpn_api_url key, injecting under an existing
        # [vpn_providers] table or appending a fresh one.
        if ! grep -q '^nordvpn_api_url' /etc/wardnet/wardnet.toml; then
          if grep -q '^\[vpn_providers\]' /etc/wardnet/wardnet.toml; then
            sed -i '/^\[vpn_providers\]/a nordvpn_api_url = "http://10.92.0.52:8080"' /etc/wardnet/wardnet.toml
          else
            printf '\n[vpn_providers]\nnordvpn_api_url = "http://10.92.0.52:8080"\n' >> /etc/wardnet/wardnet.toml
          fi
          echo "wardnetd-ui e2e fixture: pinned nordvpn_api_url=http://10.92.0.52:8080" >&2
        fi
        exec /lib/systemd/systemd --log-target=console --log-level=debug --show-status=yes
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.2
      wardnet_lan:
        ipv4_address: 10.91.0.1
      wardnet_wan:
        ipv4_address: 10.92.0.2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7411/api/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Pristine daemon for the first-run setup-wizard UI test (A1, #616).
  # The setup wizard is one-shot, and the shared `wardnetd-ui` is seeded
  # to `completed` by the `setup` project before any spec runs — so the
  # wizard UI can only be walked on a daemon that is never seeded. Reuses
  # the image `wardnetd-ui` builds (no second build), with its own state
  # volume and its own LAN network so the `10.91.0.1` lan-interface pin
  # doesn't clash with the shared daemon.
  wardnetd-ui-fresh:
    image: ${WARDNETD_UI_TEST_IMAGE:-wardnetd:dev-test-ui}
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    cgroup: host
    environment:
      container: docker
    tty: true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - wardnet_ui_fresh_state:/var/lib/wardnet
      - ../daemon/fixtures/systemd/journald-forward.conf:/etc/systemd/journald.conf.d/forward-console.conf:ro
      - ../daemon/fixtures/systemd/wardnetd-debug-logging.conf:/etc/systemd/system/wardnetd.service.d/debug-logging.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command:
      - bash
      - -c
      - |
        set +e
        chown -R wardnet:wardnet /var/lib/wardnet 2>&1 || true
        chmod 750 /var/lib/wardnet 2>&1 || true
        # Pin lan_interface to the NIC holding this daemon's LAN IP
        # (10.93.0.1 on its dedicated wardnet_lan_fresh network).
        LAN_IFACE=$$(ip -o -4 addr show | awk '/inet 10\.93\.0\.1\//{print $$2; exit}')
        if [ -n "$$LAN_IFACE" ]; then
          sed -i "s|^lan_interface = .*|lan_interface = \"$$LAN_IFACE\"|" /etc/wardnet/wardnet.toml
          echo "wardnetd-ui-fresh e2e fixture: pinned lan_interface=$$LAN_IFACE" >&2
        else
          echo "wardnetd-ui-fresh e2e fixture: WARNING no NIC holds 10.93.0.1; leaving lan_interface as-is" >&2
        fi
        exec /lib/systemd/systemd --log-target=console --log-level=debug --show-status=yes
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.3
      wardnet_lan_fresh:
        ipv4_address: 10.93.0.1
      wardnet_wan:
        ipv4_address: 10.92.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7411/api/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # TLS-terminating reverse proxy (self-signed) in front of both daemons,
  # so the browser gets a real HTTPS origin — required for the daemon's
  # `Secure` session cookie + PWA service workers. The daemon's own :443
  # is ACME-gated (503) and unusable in compose. Routes by SNI/Host via
  # the two network aliases below; Playwright trusts the cert with
  # ignoreHTTPSErrors.
  tls_proxy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    depends_on:
      wardnetd-ui:
        condition: service_healthy
      wardnetd-ui-fresh:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      wardnet_mgmt:
        aliases:
          - wardnetd-ui-tls
          - wardnetd-ui-fresh-tls
    healthcheck:
      # BusyBox wget in the Caddy Alpine image has no HTTPS support, so
      # check the TLS port is accepting connections instead. Caddy starts
      # serving in <1s; the daemons (proxy upstreams) gate separately and
      # the runner depends on all three.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # LAN-side TLS proxy for the device-keyed user-app (C1, #626). Lives
  # ONLY on wardnet_lan with a fixed IP and reverse-proxies to the
  # daemon's pinned LAN IP (10.91.0.1) — see Caddyfile.lan. The harness
  # seeds THIS proxy's LAN IP as a discovered device, so the user-app's
  # `GET /api/devices/me` (classified by source IP, no XFF trust) resolves
  # non-null while still being served over a real HTTPS origin (required
  # for service-worker registration). The static IP sits OUTSIDE the
  # wardnet_lan IPAM ip_range (10.91.0.0/28 → .0-.15) so it never collides
  # with auto-assigned containers, and inside the /24 so discovery's
  # subnet filter accepts it.
  tls_proxy_lan:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    depends_on:
      wardnetd-ui:
        condition: service_healthy
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro
    networks:
      wardnet_lan:
        # The browser/seed reach the proxy by this hostname (the Caddyfile
        # vhost + WARDNET_UI_LAN_BASE_URL); it differs from the service name,
        # so it must be a network alias or DNS won't resolve it — mirrors
        # tls_proxy's `wardnetd-ui-tls` alias.
        aliases:
          - wardnetd-ui-lan-tls
        ipv4_address: 10.91.0.20
    healthcheck:
      # BusyBox wget in the Caddy Alpine image has no HTTPS support; check
      # the TLS port is accepting connections instead (mirrors tls_proxy).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # Real LAN client used by the DHCP-leases spec (A3, #618). Runs the
  # wardnet-test-agent HTTP server on :3001; the spec drives its
  # /dhcp/renew to make `wardnetd-ui`'s DHCP server hand out a lease,
  # then asserts that lease surfaces in the admin-site DHCP table. Same
  # image + custom dhclient script as the daemon stack's test_debian
  # (the leased address lands as a secondary IPv4 so compose's
  # service-name DNS to test_debian keeps resolving). The wardnet_lan
  # IPAM range (.2-.15) sits below the .100-.150 pool the spec sets, so
  # a .100+ address is unambiguously daemon-issued.
  #
  # WARDNETD_TEST_IMAGE points at the image `wardnetd-ui` already builds
  # (WEB_DIST=real, same Dockerfile.test that bundles wardnet-test-agent),
  # so no second daemon image is compiled. The Makefile builds
  # wardnetd-ui before this service so the `FROM` resolves.
  test_debian:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/daemon/Dockerfile.client
      args:
        BASE_IMAGE: debian:bookworm-slim
        WARDNETD_TEST_IMAGE: ${WARDNETD_UI_TEST_IMAGE:-wardnetd:dev-test-ui}
    image: wardnet-test-client-debian:dev
    depends_on:
      wardnetd-ui:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      wardnet_lan: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  # Static HTTP server for the ad-blocking spec (A4, #619). Serves a
  # tiny hosts-format blocklist that the daemon fetches when the spec
  # forces a blocklist update. The daemon's downloader uses a plain
  # reqwest client (no HTTPS/SSRF guard), so plain HTTP over the mgmt
  # network is sufficient. Reuses the pinned Caddy image (same digest as
  # tls_proxy) as a `file-server` — no extra image pull. A FIXED IP is
  # used (not the service name) because the daemon is itself the DNS
  # resolver on this stack, so the spec's blocklist URL is
  # `http://10.90.0.20/hosts.txt`, sidestepping Docker service-name DNS.
  #
  # The command leads with `caddy`: this image's default CMD is the full
  # `caddy …` invocation (it does not prepend `caddy` via ENTRYPOINT), so
  # overriding `command` must name the binary explicitly.
  blocklist_server:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    command: ["caddy", "file-server", "--root", "/srv", "--listen", ":80"]
    volumes:
      - ./fixtures/blocklist:/srv:ro
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.20
    healthcheck:
      # BusyBox in the Caddy Alpine image has `nc`; just check the port
      # is accepting connections (file-server starts in <1s).
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  # NordVPN API mock (issue #248) for the admin-site providers spec (A7,
  # #622). Reuses the daemon stack's mock image/fixtures verbatim (a
  # dependency-free Node HTTP server backed by fixtures/nordvpn JSON) — do
  # not duplicate them. Pinned to 10.92.0.52 on wardnet_wan so the
  # wardnetd-ui config's nordvpn_api_url can reference a stable URL. The
  # provider wizard's validate/list/setup calls hit this instead of the real
  # api.nordvpn.com, which is unreachable inside the isolated compose net.
  nordvpn_mock:
    build:
      context: ../daemon/mocks/nordvpn
      dockerfile: Dockerfile
    image: wardnet-nordvpn-mock:dev
    volumes:
      - ../daemon/fixtures/nordvpn:/fixtures:ro
    networks:
      wardnet_wan:
        ipv4_address: 10.92.0.52
    healthcheck:
      # node:22-slim ships neither curl nor wget; probe with node itself.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  ui_runner:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/web-ui/Dockerfile.ui-runner
    image: wardnet-e2e-ui-runner:dev
    depends_on:
      wardnetd-ui:
        condition: service_healthy
      wardnetd-ui-fresh:
        condition: service_healthy
      tls_proxy:
        condition: service_healthy
      # Best-effort only (started, not healthy): the LAN client backs a
      # single spec (dhcp-leases). If it never goes healthy, the runner
      # must still start so the rest of the suite executes and that one
      # spec surfaces its own assertion failure — matching the Makefile's
      # `|| echo … running playwright anyway`. A hard `service_healthy`
      # here (with `compose run`, no `--no-deps`) would instead abort the
      # whole suite on a flaky LAN client.
      test_debian:
        condition: service_started
      # The ad-blocking spec needs this up before it forces a blocklist
      # refresh; gate the runner on it being healthy.
      blocklist_server:
        condition: service_healthy
      # The providers spec drives the NordVPN wizard against this mock; gate
      # the runner on it being healthy (the mock is a firm invariant — the
      # spec hard-fails, not skips, if the provider can't be reached).
      nordvpn_mock:
        condition: service_healthy
    environment:
      WARDNET_UI_BASE_URL: "https://wardnetd-ui-tls"
      WARDNET_UI_FRESH_BASE_URL: "https://wardnetd-ui-fresh-tls"
      WARDNET_API_BASE_URL: "http://wardnetd-ui:7411/api"
      WARDNET_TEST_DEBIAN_AGENT: "http://test_debian:3001"
      WARDNET_BLOCKLIST_FIXTURE_URL: "http://10.90.0.20/hosts.txt"
    # The mgmt runner drives the admin surfaces only; the device-keyed
    # user-app moved to `ui_runner_lan` (C1, #626). `--project` is
    # include-only, so the mgmt projects are listed explicitly (the
    # `setup` project runs automatically as their dependency).
    command:
      - yarn
      - test
      - --project
      - admin-site
      - --project
      - admin-site-setup
      - --project
      - admin-app
    # Reports bind-mounted (not a named volume) to the same host dir the
    # Makefile trap writes compose-logs.txt / inspect.json into, so the
    # JUnit + HTML report land alongside them in the CI artefact.
    volumes:
      - ./reports:/work/source/end2end-tests/web-ui/reports
      # Visual-regression baselines (V1, #628). Bind-mounted (not COPYed into
      # the image) so the host's committed baselines are what Playwright
      # compares against, and `PW_UPDATE_SNAPSHOTS=1` runs write regenerated
      # PNGs back to the host. The mount shadows any `snapshots/` baked into
      # the image, keeping the source-of-truth on the host / in git.
      - ./snapshots:/work/source/end2end-tests/web-ui/snapshots
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.10
      # Also on wardnet_lan to reach the `test_debian` LAN client agent
      # (http://test_debian:3001) used by the DHCP-leases spec.
      wardnet_lan: {}

  # LAN-side runner for the device-keyed user-app (C1, #626). On BOTH
  # networks: it drives the user-app over the LAN proxy
  # (`wardnetd-ui-lan-tls`, source IP → seeded device → non-null
  # `devices/me`) and, for the null/no-device case, navigates to the mgmt
  # proxy origin (`wardnetd-ui-tls`, source IP not a device). Runs only
  # the `user-app` project; Playwright auto-runs its `seed-lan-device`
  # dependency first (warms the LAN proxy so discovery observes
  # 10.91.0.20, then polls until that device exists). Writes its report
  # under reports/lan so it doesn't clobber the mgmt runner's report.
  ui_runner_lan:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/web-ui/Dockerfile.ui-runner
    image: wardnet-e2e-ui-runner:dev
    depends_on:
      wardnetd-ui:
        condition: service_healthy
      tls_proxy:
        condition: service_healthy
      tls_proxy_lan:
        condition: service_healthy
    environment:
      WARDNET_UI_LAN_BASE_URL: "https://wardnetd-ui-lan-tls"
      WARDNET_UI_BASE_URL: "https://wardnetd-ui-tls"
      WARDNET_API_BASE_URL: "http://wardnetd-ui:7411/api"
      # Keep this runner's JUnit + HTML report out of the mgmt runner's.
      REPORT_SUBDIR: "lan"
    command:
      - yarn
      - test
      - --project
      - user-app
    volumes:
      - ./reports:/work/source/end2end-tests/web-ui/reports
      # Visual-regression baselines (V1, #628). Bind-mounted (not COPYed into
      # the image) so the host's committed baselines are what Playwright
      # compares against, and `PW_UPDATE_SNAPSHOTS=1` runs write regenerated
      # PNGs back to the host. The mount shadows any `snapshots/` baked into
      # the image, keeping the source-of-truth on the host / in git.
      - ./snapshots:/work/source/end2end-tests/web-ui/snapshots
    networks:
      wardnet_mgmt: {}
      wardnet_lan: {}

volumes:
  wardnet_ui_state:
  wardnet_ui_fresh_state:

networks:
  wardnet_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.0.0/24
          gateway: 10.90.0.254
  wardnet_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.91.0.0/24
          gateway: 10.91.0.254
          ip_range: 10.91.0.0/28
  # Dedicated LAN for wardnetd-ui-fresh so its lan_interface pin
  # (10.93.0.1) doesn't clash with the shared daemon's 10.91.0.1.
  wardnet_lan_fresh:
    driver: bridge
    ipam:
      config:
        - subnet: 10.93.0.0/24
          gateway: 10.93.0.254
          ip_range: 10.93.0.0/28
  wardnet_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.92.0.0/24
          gateway: 10.92.0.254
