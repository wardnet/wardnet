# Daemon end-to-end test topology.
#
# Stage 6 ships the daemon container, a node:22 test runner, and two
# LAN clients (`test_debian`, `test_ubuntu`) for the DHCP scenarios.
# Stage 7 adds `blocklist_server` (busybox httpd) on wardnet_lan to
# serve the blocklist fixtures consumed by the DNS specs. Stage 10
# (issue #248) adds the VPN provider topology: `nordvpn_mock` (a Node
# HTTP mock of api.nordvpn.com), `wg_gateway` (a real WireGuard exit
# gateway), and `internet_target` (a tunnel-only reachable host). Stage
# 9 (issue #247) adds `wg_gateway_1` / `wg_gateway_2`: two plain
# WireGuard peers on wardnet_wan for the manual tunnel-import lifecycle
# specs (no NAT, no internet segment). See the e2e umbrella issue for the
# full topology, stage list, and conventions:
# https://github.com/wardnet/wardnet/issues/273
#
# Networks (per the e2e plan, Deliverable 5):
#   wardnet_mgmt 10.90.0.0/24 — test runner ↔ daemon API.
#   wardnet_lan  10.91.0.0/24 — daemon's simulated LAN. Bridge
#                              gateway parked at .254 so the daemon
#                              can own .1. Docker IPAM .2/28 (only
#                              .2–.15) leaves .100+ free for the
#                              daemon's DHCP pool + reservations.
#   wardnet_wan  10.92.0.0/24 — upstream side: nordvpn_mock (.52) and
#                              the wg_gateway (.53) tunnel underlay.
#   wardnet_internet 10.93.0.0/24 — isolated "public internet"; only
#                              wg_gateway (.1) and internet_target (.10)
#                              attach, so it is reachable from the LAN
#                              only through the WireGuard tunnel.

name: wardnet-e2e-daemon

services:
  wardnetd:
    build:
      context: ../../..
      dockerfile: source/daemon/Dockerfile.test
    image: ${WARDNETD_TEST_IMAGE:-wardnetd:dev-test}
    # systemd as PID 1 needs writable /run + /run/lock and the
    # graceful-shutdown signal. STOPSIGNAL is set in wardnet-base; the
    # tmpfs mounts and capabilities are runtime concerns and live here.
    cap_add:
      # NET_ADMIN + NET_RAW: kernel-level networking the daemon
      # actually needs (WireGuard, ip rule, nft).
      - NET_ADMIN
      - NET_RAW
      # SYS_ADMIN: required for systemd-as-PID-1 to remount the API
      # filesystems (cgroup, /sys, mqueue) during early boot. Without
      # it systemd exits ~300 ms into init with no log output and
      # the container reports ExitCode=255. Privilege scope stays
      # narrower than `privileged: true`; the plan explicitly forbids
      # the latter for the prod image.
      - SYS_ADMIN
    security_opt:
      # Docker's default AppArmor profile (docker-default) denies the
      # mount/umount syscalls systemd issues during early init.
      # `apparmor:unconfined` removes the profile for this container
      # only — the runner host is unaffected.
      - apparmor:unconfined
    # cgroup v2 + cgroupns=host lets systemd see the host's cgroup
    # hierarchy via /sys/fs/cgroup directly, instead of trying to
    # remount it inside its own namespace (which is what trips most
    # of the early-boot failures). Combined with the SYS_ADMIN +
    # apparmor relaxation above, this is the documented non-
    # privileged recipe for running systemd as PID 1 in Docker.
    cgroup: host
    # systemd 252 reads $container at startup to switch off the
    # bare-metal init paths (fsck, kernel-module loading, console
    # device probing). Without it, ConditionVirtualization checks fail
    # and systemd exits during early init before logging is wired up
    # — matching the symptom of an instant ExitCode=255 with zero
    # stdout. Setting `container=docker` is the documented contract;
    # systemd-nspawn / Podman / LXC each set their own value.
    environment:
      container: docker
    # Allocate a TTY so /dev/console has a sink. Docker's default
    # (no -t) creates /dev/console as a character device with no
    # backing terminal, which systemd's --log-target=console treats
    # as "writes succeed but nothing reaches stdout". With tty: true,
    # /dev/console becomes the master side of a pty piped to the
    # container's stdout, so systemd's logs flow through.
    tty: true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - wardnet_state:/var/lib/wardnet
      # Make systemd + journald write to the container's stdout so
      # `docker compose logs` captures wardnetd's startup output. By
      # default journald keeps everything in its in-memory ring buffer
      # and the container is silent until something explicitly writes
      # to /dev/console — which doesn't happen on a clean systemd
      # boot. The drop-in flips ForwardToConsole=yes so every journal
      # entry mirrors to /dev/console.
      - ./fixtures/systemd/journald-forward.conf:/etc/systemd/journald.conf.d/forward-console.conf:ro
      # E2E debug-logging drop-in: forces wardnetd to run with --verbose
      # (so its tracing layer attaches to stderr → journald → console)
      # and bumps wardnet-crate filters to debug. Without this the
      # daemon's only console output is the three-line println! banner
      # and any 5xx the spec hits is invisible in `compose logs`.
      - ./fixtures/systemd/wardnetd-debug-logging.conf:/etc/systemd/system/wardnetd.service.d/debug-logging.conf:ro
      # Watchdog e2e drop-in (issue #214): caps TimeoutStopSec so a frozen
      # daemon is killed promptly once WatchdogSec=15 fires, keeping
      # watchdog.spec.ts's freeze→restart assertion fast. Test-only.
      - ./fixtures/systemd/wardnetd-watchdog-test.conf:/etc/systemd/system/wardnetd.service.d/watchdog-test.conf:ro
      # systemd needs a writable /sys/fs/cgroup to manage its slice.
      # Even with cgroupns=host, Docker's default mount of
      # /sys/fs/cgroup inside the container is read-only — bind the
      # host's cgroup v2 hierarchy explicitly so systemd can create
      # its scope/slice tree there.
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    # The `exec` swap keeps systemd as PID 1 in the same way the
    # default CMD did, so STOPSIGNAL still works. The named-volume
    # mount obscures the image's wardnet:wardnet ownership of
    # /var/lib/wardnet, so re-chown before handing off to systemd
    # (which starts the daemon as User=wardnet).
    command:
      - bash
      - -c
      - |
        set +e
        chown -R wardnet:wardnet /var/lib/wardnet 2>&1 || true
        chmod 750 /var/lib/wardnet 2>&1 || true
        # Pin lan_interface to whichever NIC Docker assigned the
        # wardnet_lan IP (10.91.0.1). Docker does NOT guarantee a
        # stable eth0/eth1/eth2 mapping when a container attaches to
        # multiple networks, so the `LAN_INTERFACE=eth0` hardcoded
        # in Dockerfile.test is right by luck only. Rewrite the
        # config before systemd boots wardnetd so GARP, DHCP, the
        # mDNS advertiser, and packet capture all bind to the same
        # bridge `test_debian` is on.
        # `$$` escapes the literal `$` so compose passes the variable
        # through to the bash heredoc instead of substituting it at
        # parse time. Same with `$$2` inside the awk script.
        LAN_IFACE=$$(ip -o -4 addr show | awk '/inet 10\.91\.0\.1\//{print $$2; exit}')
        if [ -n "$$LAN_IFACE" ]; then
          sed -i "s|^lan_interface = .*|lan_interface = \"$$LAN_IFACE\"|" /etc/wardnet/wardnet.toml
          echo "wardnetd e2e fixture: pinned lan_interface=$$LAN_IFACE in /etc/wardnet/wardnet.toml" >&2
        else
          echo "wardnetd e2e fixture: WARNING no NIC holds 10.91.0.1; leaving lan_interface as-is" >&2
        fi
        # Point the NordVPN provider at the nordvpn_mock container instead of
        # the real api.nordvpn.com (issue #248, E2E Stage 10). The default
        # config ships no [vpn_providers] table. Guard on the nordvpn_api_url
        # key so this is idempotent across container restarts, then either
        # inject the key under an existing [vpn_providers] section or append a
        # fresh one. This stays correct whether or not a future base config
        # already defines [vpn_providers]: it never duplicates the table header
        # and never silently skips setting the override.
        if ! grep -q '^nordvpn_api_url' /etc/wardnet/wardnet.toml; then
          if grep -q '^\[vpn_providers\]' /etc/wardnet/wardnet.toml; then
            sed -i '/^\[vpn_providers\]/a nordvpn_api_url = "http://10.92.0.52:8080"' /etc/wardnet/wardnet.toml
          else
            printf '\n[vpn_providers]\nnordvpn_api_url = "http://10.92.0.52:8080"\n' >> /etc/wardnet/wardnet.toml
          fi
          echo "wardnetd e2e fixture: pinned nordvpn_api_url=http://10.92.0.52:8080 in /etc/wardnet/wardnet.toml" >&2
        fi
        exec /lib/systemd/systemd --log-target=console --log-level=debug --show-status=yes
    # cgroup v2 is the default on modern Docker engines; systemd
    # inside the container picks it up automatically.
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.2
      wardnet_lan:
        ipv4_address: 10.91.0.1
      wardnet_wan:
        ipv4_address: 10.92.0.2
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7411/api/info || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # LAN-client containers used by the DHCP and (later) routing /
  # multi-client scenarios. Both run `wardnet-test-agent client serve`
  # on :3001 after acquiring a lease from the daemon's DHCP server.
  # NET_ADMIN is required so the entrypoint can flush eth0 before
  # dhclient runs; without it Docker's IPAM-assigned address sticks
  # and the daemon never sees a DISCOVER. NET_RAW is the default
  # capability for raw sockets; called out explicitly so a hardened
  # base profile that drops it doesn't break dhclient.
  test_debian:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/daemon/Dockerfile.client
      args:
        BASE_IMAGE: debian:bookworm-slim
        WARDNETD_TEST_IMAGE: ${WARDNETD_TEST_IMAGE:-wardnetd:dev-test}
    image: wardnet-test-client-debian:dev
    depends_on:
      wardnetd:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      wardnet_lan: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  test_ubuntu:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/daemon/Dockerfile.client
      args:
        BASE_IMAGE: ubuntu:24.04
        WARDNETD_TEST_IMAGE: ${WARDNETD_TEST_IMAGE:-wardnetd:dev-test}
    image: wardnet-test-client-ubuntu:dev
    depends_on:
      wardnetd:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      wardnet_lan: {}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  # Static-file HTTP server for blocklist fixtures consumed by the
  # Stage 7 DNS specs. busybox httpd keeps the image tiny and avoids
  # nginx's directory-listing / CRLF normalisation on text bodies that
  # the daemon's blocklist parser would have to tolerate. Pinned to
  # 10.91.0.200 (outside wardnet_lan's IPAM range .2-.15) so specs
  # reference a stable URL even if container restart order shifts.
  blocklist_server:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/srv"]
    volumes:
      - ./fixtures/blocklists:/srv:ro
    networks:
      wardnet_lan:
        ipv4_address: 10.91.0.200
    healthcheck:
      # busybox httpd has no built-in healthcheck endpoint; a HEAD
      # against a known fixture file is the cheapest liveness signal.
      # wget --spider returns 0 on 2xx and is part of the busybox
      # image already.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/dns-blocklists.txt"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  # NordVPN API mock (issue #248, E2E Stage 10). A dependency-free Node HTTP
  # server that answers the subset of api.nordvpn.com the daemon's VPN provider
  # calls, backed by the fixtures/nordvpn JSON. Pinned to 10.92.0.52 on
  # wardnet_wan (outside that bridge's default IPAM) so the daemon config can
  # reference a stable URL. The fixtures are bind-mounted read-only so the JSON
  # can be edited without rebuilding the image.
  nordvpn_mock:
    build:
      context: ./mocks/nordvpn
      dockerfile: Dockerfile
    image: wardnet-nordvpn-mock:dev
    volumes:
      - ./fixtures/nordvpn:/fixtures:ro
    networks:
      wardnet_wan:
        ipv4_address: 10.92.0.52
    healthcheck:
      # node:22-slim ships neither curl nor wget; probe with node itself.
      test:
        - "CMD-SHELL"
        - "node -e \"require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  # WireGuard exit gateway (issue #248). Peers with the daemon-under-test using
  # the throwaway keypair the nordvpn_mock fixtures advertise, and masquerades
  # tunnel-origin traffic onto the isolated wardnet_internet net. Sits on
  # wardnet_wan (tunnel underlay, 10.92.0.53 — the hostname the mock returns)
  # and wardnet_internet (10.93.0.1). Requires the host WireGuard kernel module.
  wg_gateway:
    build:
      context: ./mocks/wg-gateway
      dockerfile: Dockerfile
    image: wardnet-wg-gateway:dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      wardnet_wan:
        ipv4_address: 10.92.0.53
      wardnet_internet:
        ipv4_address: 10.93.0.1
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s

  # The "public internet" endpoint, reachable ONLY from the far side of the
  # WireGuard tunnel (issue #248). It lives alone on wardnet_internet, which
  # neither the daemon nor the LAN clients attach to; Docker's inter-network
  # isolation blocks any host-bridged path, so a LAN client can reach
  # 10.93.0.10 iff its traffic egressed through the tunnel + wg_gateway. The
  # routing spec asserts reachability with ICMP; the httpd just provides a
  # cheap healthcheck (and a marker for any future HTTP-based probe).
  internet_target:
    image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command: ["httpd", "-f", "-v", "-p", "80", "-h", "/srv"]
    volumes:
      - ./fixtures/internet-target:/srv:ro
    networks:
      wardnet_internet:
        ipv4_address: 10.93.0.10
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/index.html"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 3s

  # Plain WireGuard peers for the manual tunnel-import lifecycle specs
  # (issue #247, E2E Stage 9). Distinct from wg_gateway (the NordVPN NAT exit
  # gateway): these do no forwarding and never touch wardnet_internet — they
  # exist only to terminate a tunnel the daemon imports from a fixture .conf, so
  # tunnel-import / bring-up / stats / fallback can drive the lifecycle against
  # a real `wg` peer. Each brings up wg0 from its bind-mounted config; the
  # throwaway keypairs live in fixtures/tunnels (see that dir's README for the
  # client<->gateway key map). Both sit on wardnet_wan at the stable IPs the
  # fixture Endpoints dial.
  wg_gateway_1:
    build:
      context: ./mocks/wg-tunnel-gateway
      dockerfile: Dockerfile
    image: wardnet-wg-tunnel-gateway:dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fixtures/tunnels/gateway-a.conf:/etc/wireguard/wg0.conf:ro
    networks:
      wardnet_wan:
        ipv4_address: 10.92.0.54
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s

  wg_gateway_2:
    build:
      context: ./mocks/wg-tunnel-gateway
      dockerfile: Dockerfile
    image: wardnet-wg-tunnel-gateway:dev
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fixtures/tunnels/gateway-b.conf:/etc/wireguard/wg0.conf:ro
    networks:
      wardnet_wan:
        ipv4_address: 10.92.0.55
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s

  test_runner:
    build:
      context: ../../..
      dockerfile: source/end2end-tests/daemon/Dockerfile.runner
    image: wardnet-e2e-runner:dev
    depends_on:
      wardnetd:
        condition: service_healthy
      test_debian:
        condition: service_healthy
      test_ubuntu:
        condition: service_healthy
      blocklist_server:
        condition: service_healthy
      nordvpn_mock:
        condition: service_healthy
      wg_gateway:
        condition: service_healthy
      internet_target:
        condition: service_healthy
      wg_gateway_1:
        condition: service_healthy
      wg_gateway_2:
        condition: service_healthy
    environment:
      WARDNET_API_BASE_URL: "http://wardnetd:7411/api"
    # Repo mounted read-only — keeps the runner image stable across
    # spec edits while preventing the test container from mutating
    # workspace files. Reports are bind-mounted (not a named volume)
    # so the host directory the Makefile trap writes compose-logs.txt
    # / compose-ps.txt / inspect.json into is the same place vitest
    # writes junit.xml + results.json — both end up in the artefact.
    volumes:
      - ../../..:/repo:ro
      - ./reports:/work/source/end2end-tests/daemon/reports
    networks:
      wardnet_mgmt:
        ipv4_address: 10.90.0.10
      # Stage 6a doesn't drive LAN-side traffic, but attaching the
      # runner to wardnet_lan now keeps the topology stable for the
      # specs landing in PR5. No static IP — Docker hands one out
      # from the bridge's IPAM range (.2–.15).
      wardnet_lan: {}

volumes:
  wardnet_state:

networks:
  wardnet_mgmt:
    driver: bridge
    ipam:
      config:
        - subnet: 10.90.0.0/24
          gateway: 10.90.0.254
  wardnet_lan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.91.0.0/24
          # Bridge gateway parked high so the daemon owns .1.
          gateway: 10.91.0.254
          # Docker hands out .2–.15 to attached containers; the
          # daemon's DHCP pool starts at .100, so any LAN client
          # holding a .100+ address unambiguously got it from the
          # daemon (PR5 dhcp.spec.ts assertion).
          ip_range: 10.91.0.0/28
  wardnet_wan:
    driver: bridge
    ipam:
      config:
        - subnet: 10.92.0.0/24
          gateway: 10.92.0.254
  # Isolated "public internet" segment for the VPN routing test (issue #248).
  # Only wg_gateway and internet_target attach here; neither the daemon nor the
  # LAN clients do. Docker's default inter-network isolation means the only way
  # a LAN client reaches 10.93.0.0/24 is through the WireGuard tunnel.
  wardnet_internet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.93.0.0/24
          gateway: 10.93.0.254
