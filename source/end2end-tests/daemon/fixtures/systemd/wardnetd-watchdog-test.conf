# Drop-in mounted into /etc/systemd/system/wardnetd.service.d/ at runtime for
# the watchdog e2e (issue #214). Test infrastructure only — NOT shipped to
# production daemons.
#
# When watchdog.spec.ts freezes the daemon with SIGSTOP, systemd's
# WatchdogSec=15 elapses with no WATCHDOG=1 ping and systemd terminates the
# unit. systemd sends SIGCONT alongside the kill signal so a stopped process
# wakes to die, but TimeoutStopSec bounds the worst case if it doesn't. The
# product unit's default (DefaultTimeoutStopSec, typically 90s) would make the
# test needlessly slow; 5s keeps the freeze→restart cycle to ~20s without
# changing the watchdog mechanism being tested.
[Service]
TimeoutStopSec=5s
