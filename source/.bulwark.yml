# bulwark configuration for the wardnet monorepo.
#
# Beyond declaring how coverage is produced, this file can only NARROW what
# bulwark does — it cannot tune rule severity or suppress individual findings,
# and that is deliberate. Genuine findings get fixed; a reviewed false positive
# gets a `biome-ignore <category>: <why>` on the line above, with a reason naming
# where the value actually comes from. No rule is switched off globally — that
# would hide the next genuine finding, which is the whole point of running this.
#
# The suppression syntax changed with bulwark v2, which made Biome the only
# TypeScript linter (bulwark ADR-0008). Two things about that run are worth
# knowing before reaching for a config file here:
#
#   * bulwark lints with its OWN bundled Biome config, passed via
#     `--config-path`, enabling the `security` and `correctness` groups at
#     `error` with no path overrides. A `biome.json` added to this repo does not
#     configure that run.
#   * A nested config marked `"root": false` *is* merged into it by Biome, which
#     is exactly why one is not used here. It would let us switch the noisy
#     rules off repo-wide and silently narrow what bulwark checks — the outcome
#     this file's policy exists to prevent.

coverage:
  # This repo's CI already runs every suite instrumented and uploads the
  # reports, so bulwark must never execute anything itself — it runs last in
  # coverage.yml purely as a report consumer. The default is `run`, which would
  # execute the Rust and TypeScript suites a third time (they already run once
  # plain for pass/fail and once instrumented for coverage).
  #
  # This lives here rather than at the call site because it describes how the
  # repo's pipeline is built — one answer, true for every workflow — which is
  # why bulwark v1.7.0 removed the `tests-mode` action input that used to carry
  # it. See wardnet/bulwark ADR 0003.
  #
  # No report paths are set: coverage.yml stages every report at the path
  # bulwark's own candidate search already checks — Rust at
  # daemon/coverage/{llvm-cov.json,lcov.info}, Go at each module's
  # coverage.out, TypeScript at each package's coverage/ directory. An override
  # here would have to be keyed per unit and would go stale the moment a module
  # is added.
  source: report

# Nothing is narrowed today. The file is also the place such decisions would be
# recorded, and explains why two tempting ones were rejected:
#
#   * `typescript: {enabled: false}` — used briefly while bulwark's ESLint check
#     was broken: it declared no `files:` glob, so it silently linted no
#     TypeScript at all, and it failed any package carrying an
#     `eslint-disable-next-line` for one of our own plugins. Fixed upstream in
#     wardnet/bulwark#13, so the check now scans .ts/.tsx for real and stays on.
#     Disabling it would have meant zero TypeScript linting, permanently.
#
#   * excluding `assets` — the vendored Scalar bundle used to live there and
#     produced 3040 of 3045 ESLint findings. `typescript.exclude` would not have
#     helped regardless: it narrows package *discovery*, not what ESLint recurses
#     into once inside a package. The bundle now sits under `assets/vendor/`,
#     which linters skip by convention.
