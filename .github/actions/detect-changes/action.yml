name: Detect changes
description: >-
  Classifies the changed paths of a push/PR into named buckets
  (daemon, site, ci, ...). Used by orchestrator workflows to gate
  heavy reusable leaves and skip noop builds.

  All filter rules live here so adding a new area (e.g. docs) is a
  one-file change instead of editing every orchestrator.

outputs:
  daemon:
    description: "'true' when daemon code, Makefile, or VERSION changed."
    value: ${{ steps.filter.outputs.daemon }}
  bridge:
    description: "'true' when bridge service code changed."
    value: ${{ steps.filter.outputs.bridge }}
  site:
    description: "'true' when marketing-site code or the Makefile changed."
    value: ${{ steps.filter.outputs.site }}
  admin-web:
    description: "'true' when @wardnet/web or admin-site code changed."
    value: ${{ steps.filter.outputs.admin-web }}
  admin-app:
    description: "'true' when admin-app or its portal deps changed."
    value: ${{ steps.filter.outputs.admin-app }}
  user-app:
    description: "'true' when user-app or its portal deps changed."
    value: ${{ steps.filter.outputs.user-app }}
  ci:
    description: "'true' when a workflow or composite action changed."
    value: ${{ steps.filter.outputs.ci }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
      id: filter
      with:
        # Every orchestrator should treat `ci == true` as "run everything":
        # a workflow/action change can invalidate any assumption and the
        # only honest response is a full validation.
        filters: |
          daemon:
            - 'source/daemon/**'
            - 'source/end2end-tests/**'
            - 'Makefile'
            - 'VERSION'
          bridge:
            - 'source/bridge/**'
          site:
            - 'source/marketing-site/**'
            - 'Makefile'
          admin-web:
            - 'source/web/**'
            - 'source/admin-site/**'
            - 'source/sdk/wardnet-js/**'
          admin-app:
            - 'source/admin-app/**'
            - 'source/web/**'
            - 'source/sdk/wardnet-js/**'
          user-app:
            - 'source/user-app/**'
            - 'source/web/**'
            - 'source/sdk/wardnet-js/**'
          ci:
            - '.github/workflows/**'
            - '.github/actions/**'
