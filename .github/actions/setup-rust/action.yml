name: Setup Rust
description: >
  Installs the pinned Rust toolchain and enables the Swatinem build cache
  against the daemon workspace. Used by every job that compiles Rust
  (check-daemon, build-daemon, coverage, release).

inputs:
  toolchain:
    description: Rust toolchain version (must match `rust-toolchain.toml`).
    required: false
    default: "1.96"
  targets:
    description: Comma- or space-separated list of additional Rust targets to install.
    required: false
    default: ""
  components:
    description: Comma-separated list of toolchain components (e.g. "clippy, rustfmt").
    required: false
    default: ""
  cache-key:
    description: >
      Optional suffix appended to the cache key. Use to isolate caches between
      workflows that build different crates/profiles (e.g. "release-aarch64").
    required: false
    default: ""
  workspaces:
    description: >
      Space-separated list of Cargo workspace roots relative to the repo root.
      Passed directly to Swatinem/rust-cache. Defaults to the daemon workspace.
    required: false
    default: "source/daemon"
  shared-key:
    description: >
      Cache lineage shared across jobs, replacing rust-cache's default of one
      cache per job. Jobs compiling the same workspace at the same profile
      should share one: separate lineages multiply a ~900MB cache by the number
      of jobs, and the repository-wide 10GB ceiling then evicts them faster than
      they are reused.
    required: false
    default: ""
  untrusted-ref:
    description: >
      The caller-supplied git ref this job checked out, if any. Empty means
      the job built the ref its own trigger vouched for.

      Load-bearing for cache integrity, not ergonomics. release-edge.yml is
      dispatched FROM the default branch and builds an arbitrary branch —
      including unmerged ones — which it passes down as `ref`. The cache scope
      is chosen by github.ref, so that run writes into the default branch's
      scope while compiling code nobody reviewed: anything privileged that
      later restores those caches executes it. Passing the ref through here
      turns cache saving off for exactly those runs, which is what
      actions/cache-poisoning/poisonable-step is reporting.
    required: false
    default: ""
  save-if:
    description: >
      Whether this run may write a cache. Defaults to the default branch only.

      Caches saved on a PR ref are readable by that PR and nothing else, so
      they buy one branch a warm build while consuming shared quota — and the
      eviction they cause lands on the default-branch caches every PR restores
      from. Restoring everywhere and saving on main is what keeps those alive.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # rustables' build.rs runs bindgen against <linux/netfilter/nf_tables.h>,
    # so every Rust-compiling job needs clang/libclang (issue #307). The x86
    # kernel uapi headers come from the runner's linux-libc-dev. Cross-compile
    # jobs additionally set BINDGEN_EXTRA_CLANG_ARGS for the target sysroot.
    - name: Install bindgen toolchain (clang)
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        workspaces: ${{ inputs.workspaces }}
        key: ${{ inputs.cache-key }}
        shared-key: ${{ inputs.shared-key }}
        # Restoring stays on everywhere; only the write is withheld, so an
        # edge build is still warm, it just cannot leave anything behind.
        save-if: ${{ inputs.untrusted-ref == '' && (inputs.save-if || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
