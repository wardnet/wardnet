name: Setup Node and Yarn
description: >
  Enables Corepack, installs a pinned Node.js, and configures Yarn 4 caching
  against a caller-provided yarn.lock path. One-step replacement for the
  "Enable Corepack + actions/setup-node with yarn cache" pattern used across
  the web UI and site builds.

inputs:
  cache-dependency-path:
    description: Path to the yarn.lock used as the cache key (e.g. source/admin-site/yarn.lock).
    required: true
  node-version:
    description: Node.js major version to install.
    required: false
    default: "25"
  untrusted-ref:
    description: >
      The caller-supplied git ref this job checked out, if any. Empty means the
      job built the ref its own trigger vouched for. See setup-rust for the
      full reasoning; in short, a run building an arbitrary branch from the
      default branch's cache scope must not write to it.

      setup-node has no restore-only mode, so a non-empty value disables the
      yarn cache entirely rather than only its save half. That costs an edge
      build one cold yarn install, which is the right trade against writing
      unreviewed code into a cache privileged workflows restore.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.untrusted-ref == '' && 'yarn' || '' }}
        cache-dependency-path: ${{ inputs.cache-dependency-path }}

    # The design system (@wardnet/{ui,styles,brand}) is consumed from GitHub
    # Packages, whose npm registry requires a token on every read — even for
    # public packages, an anonymous install fails with YN0041 "Invalid
    # authentication". source/.yarnrc.yml reads the token from GH_TOKEN, so
    # export the workflow's GITHUB_TOKEN under that name for every subsequent
    # `yarn install` in the job. The packages are public, so the default
    # contents:read token reads them cross-repo — no `packages:` permission
    # elevation (and thus no reusable-workflow caller-grant cascade) is needed.
    - name: Authenticate Yarn to GitHub Packages
      shell: bash
      run: echo "GH_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
