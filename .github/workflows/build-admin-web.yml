name: Build Admin Web

# Reusable leaf for admin-site (and its shared dep @wardnet/web) type-check,
# lint, format check, and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/web/**, source/admin-site/**, or
# source/sdk/wardnet-js/**. @wardnet/web is a portal dep of admin-site, so its
# build is validated transitively — but it also carries its own type-check and
# lint scripts, run here directly so the shared library is gated on its own
# tsconfig strictness and ESLint rules, not just as consumed by admin-site.
# The Test step also runs @wardnet/js's Vitest suite: the SDK ships as source
# to every web app and has no CI job of its own, so its unit tests ride the
# same sdk/wardnet-js/** trigger that already invalidates this leaf.

on:
  workflow_call:

permissions:
  contents: read
  # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
  # Granted by the caller job (pr.yml/ci.yml) and surfaced here so the leaf
  # doesn't restrict it back to none.
  packages: read

jobs:
  check-admin-web:
    name: Check admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      # @wardnet/js is type-checked here too: its services map between public
      # types and an internal client generated from docs/openapi.json, and that
      # mapping is the compile-time tripwire that catches wire drift. It ships
      # as source with no CI job of its own, so it rides this sdk/wardnet-js/**
      # trigger.
      - name: Type check
        run: cd source && yarn turbo run type-check --filter=@wardnet/admin-site --filter=@wardnet/web --filter=@wardnet/js

      # Regenerate the SDK's internal OpenAPI client from docs/openapi.json and
      # fail if the committed copy is stale — the same gate as `make
      # check-sdk-openapi`, mirroring the daemon's own `check-openapi`.
      - name: Check SDK OpenAPI client drift
        run: cd source && yarn workspace @wardnet/js generate:check

      - name: Lint
        run: cd source && yarn turbo run lint --filter=@wardnet/admin-site --filter=@wardnet/web

      - name: Format check
        run: cd source && yarn turbo run format:check --filter=@wardnet/admin-site --filter=@wardnet/web --filter=@wardnet/js

      - name: Test
        run: cd source && yarn turbo run test --filter=@wardnet/admin-site --filter=@wardnet/web --filter=@wardnet/js

  build:
    name: Build admin-web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          build-command: cd source && yarn install --immutable && yarn turbo run build --filter=@wardnet/admin-site
