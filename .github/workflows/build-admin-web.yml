name: Build Admin Web

# Reusable leaf for admin-site/web (and its shared dep wardnet-web) type-check
# and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/wardnet-web/**, source/admin-site/**, or
# source/sdk/wardnet-js/** — wardnet-web is a portal dep of admin-site/web, so
# the admin-site type-check and build implicitly validates wardnet-web too.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-admin-web:
    name: Check admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/admin-site/yarn.lock

      - name: Install deps
        run: cd source/admin-site && yarn install --immutable

      - name: Type check
        run: cd source/admin-site/web && yarn type-check

      - name: Format check
        run: cd source/admin-site/web && yarn format:check

  build:
    name: Build admin-web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/admin-site/yarn.lock
          build-command: cd source/admin-site && yarn install --immutable && cd web && yarn build
