name: Build Admin Web

# Reusable leaf for admin-site (and its shared dep @wardnet/web) type-check,
# lint, format check, and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/web/**, source/admin-site/**, or
# source/sdk/wardnet-js/**. @wardnet/web is a portal dep of admin-site, so its
# build is validated transitively — but it also carries its own type-check and
# lint scripts, run here directly so the shared library is gated on its own
# tsconfig strictness and ESLint rules, not just as consumed by admin-site.

on:
  workflow_call:

permissions:
  contents: read
  # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
  # Granted by the caller job (pr.yml/ci.yml) and surfaced here so the leaf
  # doesn't restrict it back to none.
  packages: read

jobs:
  check-admin-web:
    name: Check admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Type check
        run: cd source && yarn turbo run type-check --filter=@wardnet/admin-site --filter=@wardnet/web

      - name: Lint
        run: cd source && yarn turbo run lint --filter=@wardnet/admin-site --filter=@wardnet/web

      - name: Format check
        run: cd source && yarn turbo run format:check --filter=@wardnet/admin-site --filter=@wardnet/web

      - name: Test
        run: cd source && yarn turbo run test --filter=@wardnet/admin-site --filter=@wardnet/web

  build:
    name: Build admin-web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          build-command: cd source && yarn install --immutable && yarn turbo run build --filter=@wardnet/admin-site
