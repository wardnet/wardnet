name: Build Admin Web

# Reusable leaf for admin-site (and its shared dep @wardnet/web) type-check
# and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/web/**, source/admin-site/**, or
# source/sdk/wardnet-js/** — @wardnet/web is a portal dep of admin-site, so
# the admin-site type-check and build implicitly validates @wardnet/web too.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-admin-web:
    name: Check admin-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Type check
        run: cd source && yarn turbo run type-check --filter=@wardnet/admin-site

      - name: Format check
        run: cd source/admin-site && yarn format:check

  build:
    name: Build admin-web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          build-command: cd source && yarn install --immutable && yarn turbo run build --filter=@wardnet/admin-site
