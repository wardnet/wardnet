name: Build Site

# Reusable leaf for marketing-site lint + build.
#
# Callers: ci-build.yml (the gt build stage), and release.yml directly.
# Produces a single artifact with a fixed name:
#
#   - site-dist — source/marketing-site/dist/ tree (raw, not pages-artifact)
#
# deploy-site.yml wraps it into a pages-artifact at deploy time. This
# split keeps build-site.yml callable from orchestrators that don't
# deploy (PR, CI-on-main), and keeps deploy-site.yml strictly about
# shipping to Pages.
#
# Site coverage lives in coverage.yml, NOT here — Codecov expects a
# single coordinated upload per PR, and splitting across leaves
# produces dueling PR comments.

on:
  workflow_call:
    inputs:
      from-default-branch:
        description: >
          Build the site from the repository's default branch instead of the
          caller's ref. release-edge.yml sets this: an edge build can be cut
          from any branch, and the marketing site that reaches production
          Pages must never come from unmerged work.

          A boolean rather than the free-form `ref` string this replaced. The
          safety property is identical, but the ref now comes from repository
          metadata instead of from whatever a caller passes — and a
          workflow_call input reaching `checkout` is exactly what makes every
          step after it a cache-poisoning sink, because the job holds the
          Actions cache token and untrusted code can write the caller's cache
          scope directly regardless of how our own cache steps are configured.
        type: boolean
        default: false

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller.
permissions:
  contents: read
  # Read @wardnet/{brand,styles} from GitHub Packages during yarn install.
  # Granted by the caller job (ci-build.yml/release.yml) and surfaced here so
  # the leaf doesn't restrict it back to none.
  packages: read

jobs:
  check-site:
    name: Check Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.from-default-branch && github.event.repository.default_branch || '' }}

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      # Run type-check + format:check only. The site unit tests run in
      # coverage.yml with instrumentation; running them here too would
      # be duplicated work.
      - name: Install deps
        run: cd source/marketing-site && yarn install --immutable

      - name: Type check
        run: cd source/marketing-site && yarn type-check

      - name: Format check
        run: cd source/marketing-site && yarn format:check

  build:
    name: Build Site bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.from-default-branch && github.event.repository.default_branch || '' }}

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          # Authenticated token lifts the manifest generator's GitHub
          # API rate-limit from 60/hr (anonymous) to 5000/hr.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: make build-site
          artifact-name: site-dist
          artifact-path: source/marketing-site/dist/
          retention-days: "7"
