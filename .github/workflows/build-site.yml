name: Build Site

# Reusable leaf for marketing-site lint + build.
#
# Callers: ci.yml (push to main), pr.yml (PRs), indirectly release.yml.
# Produces a single artifact with a fixed name:
#
#   - site-dist — source/marketing-site/dist/ tree (raw, not pages-artifact)
#
# deploy-site.yml wraps it into a pages-artifact at deploy time. This
# split keeps build-site.yml callable from orchestrators that don't
# deploy (PR, CI-on-main), and keeps deploy-site.yml strictly about
# shipping to Pages.
#
# Site coverage lives in coverage.yml, NOT here — Codecov expects a
# single coordinated upload per PR, and splitting across leaves
# produces dueling PR comments.

on:
  workflow_call:

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller.
permissions:
  contents: read
  # Read @wardnet/{brand,styles} from GitHub Packages during yarn install.
  # Granted by the caller job (pr.yml/ci.yml/release.yml) and surfaced here so
  # the leaf doesn't restrict it back to none.
  packages: read

jobs:
  check-site:
    name: Check Site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      # Run type-check + format:check only. The site unit tests run in
      # coverage.yml with instrumentation; running them here too would
      # be duplicated work.
      - name: Install deps
        run: cd source/marketing-site && yarn install --immutable

      - name: Type check
        run: cd source/marketing-site && yarn type-check

      - name: Format check
        run: cd source/marketing-site && yarn format:check

  build:
    name: Build Site bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          # Authenticated token lifts the manifest generator's GitHub
          # API rate-limit from 60/hr (anonymous) to 5000/hr.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          build-command: make build-site
          artifact-name: site-dist
          artifact-path: source/marketing-site/dist/
          retention-days: "7"
