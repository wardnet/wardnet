name: Fuzzing (maintenance)

# Weekly ClusterFuzzLite maintenance — coverage reports + corpus
# pruning. Separated from fuzzing-scheduled.yml because these jobs
# don't need twice-daily cadence and the reports are cheaper to
# produce all at once on a quiet schedule.
#
# Coverage output publishes to the `gh-pages` branch of
# wardnet/wardnet-fuzz-corpus; browse at
# https://github.com/wardnet/wardnet-fuzz-corpus/tree/gh-pages/coverage
# (or the GH Pages URL once that branch is Pages-enabled).

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Top-level read-only; `issues: write` is granted per-job to the CFLite
# runs that can file a crash issue, keeping the token least-privilege.
permissions:
  contents: read

jobs:
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write  # CFLite run_fuzzers files a GitHub Issue on a new crash
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build Fuzzers (coverage sanitizer)
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: https://x-access-token:${{ secrets.FUZZ_CORPUS_PAT }}@github.com/wardnet/wardnet-fuzz-corpus.git
          storage-repo-branch: main
          storage-repo-branch-coverage: gh-pages

  prune:
    name: Prune corpus
    needs: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # CFLite run_fuzzers files a GitHub Issue on a new crash
    # fuzz-seconds (20) + CFLite build + setup.
    timeout-minutes: 40
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: address

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          fuzz-seconds: 1200
          mode: prune
          sanitizer: address
          github-token: ${{ secrets.GITHUB_TOKEN }}
          storage-repo: https://x-access-token:${{ secrets.FUZZ_CORPUS_PAT }}@github.com/wardnet/wardnet-fuzz-corpus.git
          storage-repo-branch: main
