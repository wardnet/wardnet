name: CodeQL

# Advanced CodeQL setup for Wardnet.
#
# Switched from GitHub's default setup so we can pass a config file that
# excludes test paths from analysis — tests contain intentional "bad"
# patterns (hard-coded fixture passwords, canned keys) that make the
# default setup noisy without adding signal.
#
# Matrix mirrors what default setup used to analyse (actions,
# javascript-typescript, rust). Adding a language is one matrix entry.
#
# NOTE: after this workflow runs green for the first time, disable the
# default setup in Settings → Security → Code scanning, otherwise both
# will run and produce duplicate alerts.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly sweep so new CVEs in the query pack surface even without pushes.
    - cron: "0 4 * * 1"

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The Rust extractor uses source-only analysis (`build-mode: none`)
        # — manual/autobuild are not supported. `actions` and
        # `javascript-typescript` are also source-only.
        #
        # Go is compiled rather than source-extracted: `autobuild` builds the
        # modules so the extractor sees resolved types. It covers the SDK
        # (published to outside consumers) and wctl (shipped as a signed
        # release binary), neither of which was analysed before.
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
          - language: go
            build-mode: autobuild
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
