name: Build Admin App

# Reusable leaf for admin-app (admin PWA) type-check and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/admin-app/**, source/web/**, or
# source/sdk/wardnet-js/** — all are portal dependencies that admin-app
# resolves at build time.
#
# Produces no artifact: the daemon compilation rebuilds all web apps via
# `make build-web`, so there is no downstream consumer for a standalone
# admin-app dist. This workflow validates that the app type-checks and builds
# cleanly on every relevant change.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-admin-app:
    name: Check admin-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Type check
        run: cd source && yarn turbo run type-check --filter=@wardnet/admin-app

  build:
    name: Build admin-app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          build-command: cd source && yarn install --immutable && yarn turbo run build --filter=@wardnet/admin-app
