name: Release

# Tag-driven release orchestrator.
#
# Composes the same leaves as the gt ci-* stages plus release-specific
# ones. Release does NOT nest the CI orchestrator — its preflight gating
# (paths-filter) is meaningless on a tag push, and coverage shouldn't
# run on release (Codecov's patch-coverage is PR-keyed).
#
# `workflow_dispatch` is supported for dry runs on non-tag refs: the
# build + sign paths all run, but `release-daemon` (publish) is gated
# on the ref being a tag so nothing reaches GitHub Releases.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Workflow-level permissions stay read-only. Each leaf elevates to
# the writes it actually needs via its own `permissions:` block —
# Scorecard's Token-Permissions check rewards this scoping. The
# write-scoped permissions per leaf are:
#   - build-daemon  → security-events: write (clippy SARIF upload)
#   - deploy-site   → pages: write, id-token: write (GH Pages publish)
#   - release-daemon → contents: write (`gh release create`)
#   - release-image → packages: write (GHCR push)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  resolve:
    name: Resolve version and channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Resolve version and classify channel from ref
        id: version
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"

            # The tag must match ./CALVER, the public-facing release
            # version. The Cargo workspace version (./VERSION) is on a
            # separate SemVer track and intentionally not tied to tags —
            # comparing the tag against ./VERSION here would reject
            # legitimate CalVer tags like `v2026.05.03` against a Cargo
            # version like `0.1.0`.
            FILE_VERSION="$(tr -d '[:space:]' < CALVER)"
            if [[ "${VERSION%%-*}" != "${FILE_VERSION%%-*}" ]]; then
              echo "::error::tag v${VERSION} does not agree with ./CALVER (${FILE_VERSION}). Bump CALVER and re-tag."
              exit 1
            fi
          else
            # workflow_dispatch on a non-tag ref — derive a dev version.
            TAG=""
            VERSION="$(git describe --tags --always --dirty | sed 's/^v//')"
          fi

          # CalVer pre-release suffix (e.g. `2026.05.03-beta.1`) → beta
          # channel. Stable CalVer tags never carry a `-` segment.
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Release version: ${VERSION} (tag=${TAG:-<dispatch>}, prerelease=${PRERELEASE})"

  build-daemon:
    name: Build Daemon
    needs: resolve
    permissions:
      contents: read
      actions: read
      security-events: write
      # build-web reads @wardnet/* from GitHub Packages.
      packages: read
    uses: ./.github/workflows/build-daemon.yml
    secrets: inherit

  build-site:
    name: Build Site
    needs: resolve
    # Read @wardnet/{brand,styles} from GitHub Packages during yarn install.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-site.yml
    secrets: inherit

  tests-e2e:
    name: E2E Tests
    needs: [build-daemon, build-site]
    # build-web (run on the host before the Docker build) reads @wardnet/*
    # from GitHub Packages.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests-e2e.yml
    secrets: inherit

  # Refresh /releases/stable.json + /releases/beta.json after release-
  # daemon publishes the GitHub release. build-site runs in parallel
  # with release-daemon, so its bundled manifest predates the release —
  # leaving it deployed would ship a stable.json that doesn't list the
  # tag we just cut, breaking install.sh and the daemon's auto-update
  # runner. This job re-runs the manifest generator (which queries the
  # GitHub Releases API), patches the resulting JSON into the existing
  # site bundle, and re-uploads under a different artefact name so
  # deploy-site picks up the fresh copy.
  refresh-manifest:
    name: Refresh release manifest in site bundle
    needs: [build-site, release-daemon]
    # On non-tag dispatch, release-daemon is skipped — fall through and
    # ship the bundle as-is. `if: always()` is needed because skipped
    # ancestors set `needs.release-daemon.result` to "skipped", which by
    # default would skip this job too.
    if: |
      always() &&
      needs.build-site.result == 'success' &&
      (needs.release-daemon.result == 'success' ||
       needs.release-daemon.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Installs marketing-site, which pulls @wardnet/{brand,styles} from GitHub
    # Packages; the manifest step additionally uses GITHUB_TOKEN for the
    # Releases API.
    permissions:
      contents: read
      packages: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download original site bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site-dist
          path: site/

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install site dependencies
        run: cd source/marketing-site && yarn install --immutable

      - name: Regenerate release manifests
        env:
          # Authenticated token lifts the manifest generator's GitHub
          # API rate limit (60/hr → 1000/hr) so the API call won't fail
          # silently and ship an empty manifest.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd source/marketing-site && yarn generate:release-manifests

      - name: Patch refreshed manifests into bundle
        run: |
          set -euo pipefail
          cp source/marketing-site/public/releases/stable.json site/releases/stable.json
          cp source/marketing-site/public/releases/beta.json   site/releases/beta.json
          # edge.json is regenerated here too. This run did not publish an edge
          # build, but the generator is the only writer of all three manifests
          # and copying two of them would leave the deployed edge.json older
          # than its siblings — and, worse, silently revert an edge build
          # published between this bundle's build and its deploy.
          #
          # Only copy it when it actually names a build: with no edge release
          # published (or after a failed API call, which makes the generator
          # emit empty placeholders rather than fail) the regenerated file is an
          # empty manifest, and overwriting a live edge.json with that would
          # strand any box on the edge channel.
          EDGE_VERSION="$(jq -r '.version // ""' source/marketing-site/public/releases/edge.json)"
          if [[ -n "${EDGE_VERSION}" ]]; then
            cp source/marketing-site/public/releases/edge.json site/releases/edge.json
            echo "Refreshed edge.json → ${EDGE_VERSION}"
          else
            echo "edge.json is empty — leaving the bundled copy untouched."
          fi
          echo "Refreshed stable.json:"
          cat site/releases/stable.json

      - name: Upload refreshed bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-dist-refreshed
          path: site/
          retention-days: 1

  deploy-site:
    name: Deploy Site
    needs: [refresh-manifest, tests-e2e]
    # The default `success()` predicate walks the transitive needs
    # graph: release-daemon is in deploy-site's ancestors via
    # refresh-manifest, and release-daemon is skipped on every
    # workflow_dispatch (gated to tag pushes). With the default `if`
    # that propagates as a skip onto deploy-site, even though both
    # immediate needs ran cleanly. Pin the predicate to the immediate
    # needs so dispatch runs (which are the only path that refreshes
    # the manifest without re-publishing the GitHub release) actually
    # ship to Pages.
    if: |
      always() &&
      needs.refresh-manifest.result == 'success' &&
      needs.tests-e2e.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-site.yml
    with:
      bundle-artifact: site-dist-refreshed
    secrets: inherit

  release-daemon:
    name: Release Daemon
    needs: [resolve, build-daemon, tests-e2e]
    # Only publish when triggered by an actual tag push. workflow_dispatch
    # runs exercise the full build + sign path but stop short of the
    # `gh release create` call.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # SLSA build-provenance attestation in release-daemon.yml needs both.
      # A reusable workflow's job permissions cannot exceed what the caller
      # grants, so they have to be declared here too — not just in the
      # callee.
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-daemon.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      tag: ${{ needs.resolve.outputs.tag }}
      prerelease: ${{ fromJSON(needs.resolve.outputs.prerelease) }}
    secrets: inherit

  # The Go SDK is NOT released from here. It publishes on its own
  # `wardnet-go@x.y.z` tag (.github/workflows/release-go-sdk.yml), the same
  # shape as @wardnet/js. Hanging it off this workflow conflated "a daemon
  # release happened" with "the SDK has something to ship": an unbumped
  # VERSION published nothing while the release still went green, and an
  # SDK-only fix could not ship without cutting a daemon release.

  release-image:
    name: Release Image
    # release-image consumes the published release tarball, so it
    # must run AFTER release-daemon — the Dockerfile curls
    # `https://github.com/.../releases/download/v${VERSION}/...`.
    needs: [resolve, release-daemon]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release-image.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      prerelease: ${{ fromJSON(needs.resolve.outputs.prerelease) }}
    secrets: inherit
