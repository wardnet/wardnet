name: Build Daemon

# Reusable leaf for daemon lint + test + release builds.
#
# Callers: ci.yml (push to main), pr.yml (PRs), indirectly release.yml
# (via pr.yml). Produces three artifacts with fixed names that
# downstream jobs and workflows download by reference:
#
#   - wardnetd-x86_64-unsigned   — stripped wardnetd binary, tarball
#   - wardnetd-aarch64-unsigned  — stripped wardnetd binary, tarball
#   - wardnet-mock-x86_64        — stripped wardnetd-mock binary, tarball
#
# No version in the filename — release-daemon.yml renames to
# wardnetd-<version>-<arch>.tar.gz at publish time. Keeping build-daemon
# release-agnostic means every PR run produces a tarball in the same
# shape a release consumes, so signing+publishing is a thin wrapper.
#
# The wardnetd-mock binary is x86_64-only on purpose — it's a dev/test
# tool, not a release asset, and building it for aarch64 would add
# ~3min of cross-compile time with zero consumers.

on:
  workflow_call:
    inputs:
      ref:
        description: >
          Git ref to build. Empty (default) builds the caller's ref. The edge
          channel passes an arbitrary branch here, including unmerged ones.
        type: string
        default: ""
      version:
        description: >
          Pin WARDNET_VERSION to this value instead of deriving it from git.
          Empty (default) keeps the existing behaviour: tag pushes pin to the
          tag, everything else gets `-dev.N+gHASH` from `git describe`. Edge
          builds pass `<base-calver>-edge.<run-number>`, which no tag carries.
        type: string
        default: ""
      run-checks:
        description: >
          Run check-daemon + check-openapi before building. Edge builds pass
          `false` deliberately (ADR-0023): for a branch that came from a PR the
          gates already ran, and for an experiment the whole point may be to
          test a build the gates would reject. Every gate here re-imports the
          latency edge exists to delete.
        type: boolean
        default: true

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller. `check-daemon` escalates to
# `security-events: write` via its own job-level block.
permissions:
  contents: read
  # The build-web job installs the web apps, which pull
  # @wardnet/{ui,styles,brand} from GitHub Packages. Granted by the caller job
  # (pr.yml/ci.yml/release.yml) and surfaced here so the leaf doesn't restrict
  # it back to none. (check-daemon overrides this block with its own scopes.)
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check-daemon:
    name: Check Daemon
    if: inputs.run-checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Upload clippy SARIF to Code Scanning.
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
          # Shared with check-openapi: same workspace, same debug profile, so
          # two lineages held two ~900MB copies of the same dependency build.
          shared-key: daemon-debug

      - name: Install clippy SARIF tooling
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: clippy-sarif,sarif-fmt

      - name: Check
        # SARIF_OUT flips `make check-daemon` into piping clippy output
        # through clippy-sarif — single clippy run, SARIF as by-product.
        run: make check-daemon SARIF_OUT=rust-clippy-results.sarif

      - name: Upload clippy findings to Code Scanning
        # Upload even if Check failed (captures the warnings that caused
        # the failure) — but only when SARIF was actually written. If
        # cargo fmt --check fails (runs before clippy), no SARIF exists;
        # hashFiles evaluates to empty and the upload is skipped.
        #
        # `category` is pinned explicitly so main (caller = ci.yml) and
        # PRs (caller = pr.yml) publish under the same identifier.
        # Without this, upload-sarif derives the category from the
        # caller workflow path, and code-scanning flags PRs with
        # "1 configuration not found" because the PR's category has no
        # counterpart in main's baseline — which surfaces as a NEUTRAL
        # conclusion and blocks merges under the `code_quality` rule.
        if: always() && hashFiles('rust-clippy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: rust-clippy-results.sarif
          category: rust-clippy
          wait-for-processing: true

  check-openapi:
    name: Check OpenAPI drift
    if: inputs.run-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          # Same workspace and profile as check-daemon, so they share one
          # lineage rather than each holding its own ~900MB copy.
          shared-key: daemon-debug

      - name: Regenerate docs/openapi.json and verify no drift
        # `make check-openapi` runs `dump_openapi` against the current
        # handler annotations and diffs against the committed file. Any
        # API change must land with a fresh `docs/openapi.json`.
        run: make check-openapi

  build-web:
    name: Build Web (for daemon embed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Build
        run: make build-web

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-ui-dist
          # The daemon embeds all three web trees (user-app, admin-app,
          # admin-site) via rust-embed; carry every dist/ to the build job, not
          # just admin-site, or the user PWA (/) and admin mobile PWA
          # (/admin-app/) ship empty. The common ancestor is source/, so archive
          # entries are admin-{site,app}/dist/… and user-app/dist/….
          path: |
            source/admin-site/dist/
            source/user-app/dist/
            source/admin-app/dist/
          retention-days: 1

  build:
    name: Build Daemon (${{ matrix.arch }})
    needs: [build-web, check-daemon]
    # check-daemon is skipped when run-checks is false (edge builds). A
    # skipped ancestor propagates as a skip under the default predicate,
    # so pin it: build runs iff the web build succeeded and check-daemon
    # either passed or was deliberately not run.
    if: |
      always() &&
      needs.build-web.result == 'success' &&
      (needs.check-daemon.result == 'success' ||
       needs.check-daemon.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            strip: strip
            build-mock: true
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip
            cross_apt_packages: gcc-aarch64-linux-gnu
            build-mock: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}

      # rust-embed picks the web UI up from these directories at daemon
      # compile time. Downloading the shared artifact avoids re-running
      # `yarn build` per matrix entry. The artifact stores paths relative to
      # source/ (the common ancestor of the three dist trees), so extract it
      # there to restore source/{admin-site,user-app,admin-app}/dist/.
      - name: Download web-ui dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: web-ui-dist
          path: source/

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}

      # clang/libclang for rustables' bindgen is installed by setup-rust.

      - name: Install cross-compilation toolchain
        if: matrix.cross_apt_packages != ''
        run: |
          sudo apt-get update && sudo apt-get install -y ${{ matrix.cross_apt_packages }}
          # Point bindgen's clang at the aarch64 sysroot for arch-specific libc
          # headers, but fall back to the host's arch-agnostic kernel uapi
          # headers (linux/netfilter/*) via -idirafter. May need tuning in CI.
          echo "BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu -idirafter /usr/include" >> "$GITHUB_ENV"

      - name: Pin WARDNET_VERSION for release and edge builds
        # The downloaded web-ui-dist artifact lands real Vite output on top of
        # the tracked `.info` sentinels in each source/*/dist. That dirties the
        # worktree, so the `wardnetd-services`
        # / `wardnetd` build scripts' `git describe --tags --dirty` ends
        # up emitting `<calver>-dirty` for an otherwise-clean tag commit
        # — which is what users see as "Current version" in the Updates
        # card. Bypass git describe entirely on tag pushes by setting
        # the documented WARDNET_VERSION_OVERRIDE escape hatch to the
        # tag (sans `v`). For PR / push-to-main runs the override stays
        # empty so binaries keep the `-dev.N+gHASH` commit identifier.
        #
        # An explicit `version` input wins over the tag: edge builds are cut
        # from a branch with no tag of their own, and the version they must
        # report (`<base-calver>-edge.<run>`) exists nowhere in git — the
        # updater compares it against what the box is running, so a binary
        # that reported `-dev.N+gHASH` here would never look "newer".
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${VERSION_INPUT}" ]]; then
            VERSION="${VERSION_INPUT}"
          else
            VERSION="${REF_NAME#v}"
          fi
          echo "WARDNET_VERSION_OVERRIDE=${VERSION}" >> "${GITHUB_ENV}"

          # WARDNET_RELEASE_VERSION (the public-facing CalVer) defaults to
          # whatever CALVER says in the tree being built. For a tag build those
          # agree. For an edge build they do NOT: CALVER still reads the last
          # release (e.g. `2026.07.00-beta.5`), so without this the binary would
          # report the edge version as WARDNET_VERSION while still claiming to be
          # beta.5 everywhere WARDNET_RELEASE_VERSION is surfaced. Pin both to
          # the same string.
          echo "WARDNET_RELEASE_VERSION_OVERRIDE=${VERSION}" >> "${GITHUB_ENV}"
          echo "Pinned WARDNET_VERSION_OVERRIDE=${VERSION} (and WARDNET_RELEASE_VERSION_OVERRIDE)"

      - name: Build wardnetd
        env:
          TARGET: ${{ matrix.target }}
          CRATE: wardnetd
        run: make build-daemon

      - name: Build wardnet-postupgrade-runner
        # Trust anchor for the privileged post-upgrade pipeline. Ships
        # in the tarball; install.sh extracts it; FsBinaryApplier
        # ignores it during auto-update so the runner only changes when
        # an operator runs install.sh.
        env:
          TARGET: ${{ matrix.target }}
          CRATE: wardnet-postupgrade-runner
        run: make build-daemon

      - name: Build wardnet-postupgrade
        # Privileged migration runner. Signed by release-daemon.yml
        # using the same minisign key as the tarball, then bundled into
        # the tarball as `wardnet-postupgrade.bin` + `.minisig`.
        env:
          TARGET: ${{ matrix.target }}
          CRATE: wardnet-postupgrade
        run: make build-daemon

      - name: Build wardnetd-mock (x86_64 only)
        if: matrix.build-mock
        env:
          TARGET: ${{ matrix.target }}
          CRATE: wardnetd-mock
        run: make build-daemon

      - name: Strip binaries
        env:
          STRIP_TOOL: ${{ matrix.strip }}
          TARGET: ${{ matrix.target }}
          BUILD_MOCK: ${{ matrix.build-mock }}
        run: |
          set -euo pipefail
          BIN_DIR="source/daemon/target/${TARGET}/release"
          "${STRIP_TOOL}" "${BIN_DIR}/wardnetd"
          "${STRIP_TOOL}" "${BIN_DIR}/wardnet-postupgrade-runner"
          "${STRIP_TOOL}" "${BIN_DIR}/wardnet-postupgrade"
          ls -l "${BIN_DIR}/wardnetd" \
                "${BIN_DIR}/wardnet-postupgrade-runner" \
                "${BIN_DIR}/wardnet-postupgrade"
          if [[ "${BUILD_MOCK}" == "true" ]]; then
            "${STRIP_TOOL}" "${BIN_DIR}/wardnetd-mock"
            ls -l "${BIN_DIR}/wardnetd-mock"
          fi

      - name: Package wardnetd
        # Tarball ships unsigned at this stage; release-daemon.yml
        # signs the post-upgrade payload (renaming wardnet-postupgrade
        # → wardnet-postupgrade.bin and producing .minisig) and
        # repacks before signing the outer tarball.
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p build-artefacts/staged-wardnetd
          cp "source/daemon/target/${TARGET}/release/wardnetd" \
            "build-artefacts/staged-wardnetd/wardnetd"
          cp "source/daemon/target/${TARGET}/release/wardnet-postupgrade-runner" \
            "build-artefacts/staged-wardnetd/wardnet-postupgrade-runner"
          cp "source/daemon/target/${TARGET}/release/wardnet-postupgrade" \
            "build-artefacts/staged-wardnetd/wardnet-postupgrade"
          cp deploy/wardnet-postupgrade.service \
            "build-artefacts/staged-wardnetd/wardnet-postupgrade.service"
          chmod 0755 "build-artefacts/staged-wardnetd/wardnetd" \
                     "build-artefacts/staged-wardnetd/wardnet-postupgrade-runner" \
                     "build-artefacts/staged-wardnetd/wardnet-postupgrade"
          chmod 0644 "build-artefacts/staged-wardnetd/wardnet-postupgrade.service"
          tar -C build-artefacts/staged-wardnetd \
            -czf "build-artefacts/wardnetd-${ARCH}.tar.gz" \
            wardnetd \
            wardnet-postupgrade-runner \
            wardnet-postupgrade \
            wardnet-postupgrade.service

      - name: Upload wardnetd artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wardnetd-${{ matrix.arch }}-unsigned
          path: build-artefacts/wardnetd-${{ matrix.arch }}.tar.gz
          retention-days: 7

      - name: Package wardnetd-mock (x86_64 only)
        if: matrix.build-mock
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p build-artefacts/staged-mock
          cp "source/daemon/target/${TARGET}/release/wardnetd-mock" \
            "build-artefacts/staged-mock/wardnetd-mock"
          chmod 0755 "build-artefacts/staged-mock/wardnetd-mock"
          tar -C build-artefacts/staged-mock \
            -czf "build-artefacts/wardnet-mock-x86_64.tar.gz" wardnetd-mock

      - name: Upload wardnetd-mock artifact (x86_64 only)
        if: matrix.build-mock
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wardnet-mock-x86_64
          path: build-artefacts/wardnet-mock-x86_64.tar.gz
          retention-days: 7
