name: E2E Tests

# Reusable leaf for end-to-end tests.
#
# Stage 6a (PR4) wires up only the daemon scaffolding + a single smoke
# spec — enough to prove the docker-compose harness boots end-to-end on
# a Linux runner. Subsequent PRs (Stage 6b/c) layer in the LAN clients
# (test_alpine, test_ubuntu) and the real scenarios (DHCP, DNS,
# routing, etc.).
#
# Job topology:
#   end2end-tests-daemon — single ubuntu-latest job, builds the test
#                          image (compiles wardnetd from source on top
#                          of wardnet-base), brings up the compose
#                          stack, runs `yarn vitest run` inside the
#                          test_runner container, uploads the JUnit/
#                          JSON reports + compose logs as artefacts.
#   end2end-tests-ui     — parallel ubuntu-latest job, builds the three
#                          frontends + a real-asset wardnetd-ui image,
#                          and runs the Playwright suite (admin-site /
#                          admin-app / user-app smokes) inside the
#                          ui_runner container.
#
# Triggered via ci-end2end.yml, the gt end2end stage, as a workflow_call leaf —
# matches the rest of the build-* / coverage / placeholder pattern in
# the repo.

on:
  workflow_call:

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller.
permissions:
  contents: read
  # Both e2e jobs run `make build-web` on the host before the Docker build;
  # that installs the web apps, which pull @wardnet/{ui,styles,brand} from
  # GitHub Packages. Read, not write: nothing here publishes a package any
  # more. Granted by the caller job (ci-end2end.yml/release.yml) and surfaced
  # here so the leaf doesn't restrict it back to none.
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  end2end-tests-daemon:
    name: E2E Daemon Tests
    runs-on: ubuntu-latest
    # Generous ceiling: image-test rebuilds wardnetd + wardnet-test-agent
    # from scratch inside Docker (~7-10 min on a cold runner), then
    # recompiles wardnetd a second time at the e2e release version for the
    # auto-update swap spec (issue #319 — the version override invalidates
    # wardnetd-services and its dependents, so it is a partial rebuild, not
    # a second cold one). A future optimisation will pre-feed the prebuilt
    # binaries via a PREBUILT_BIN_DIR build arg, at which point this drops
    # substantially.
    timeout-minutes: 55
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # `make image-test` builds the web UI as a prerequisite (the
      # daemon embeds all three web dist/ dirs via rust-embed). Caching the
      # web-ui yarn install is the biggest single win here; the e2e
      # test_runner package's deps install inside Docker and are
      # cached by the Docker layer cache instead.
      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - uses: ./.github/actions/setup-rust



      - name: Run daemon e2e suite
        # `make end2end-daemon` chains: build-web → image-test (cargo build
        # inside Docker) → compose up --wait wardnetd → vitest in test_runner →
        # trap dumps compose logs into reports/ and tears the stack down.
        # Reports are written even on failure.
        #
        # CONTAINER_RT=docker forces Docker's BuildKit instead of the
        # Makefile's default podman-first auto-detection. ubuntu-latest ships
        # both binaries; podman's classic image builder rejects the BuildKit
        # heredoc syntax used in source/daemon/Dockerfile.test ("Unknown
        # instruction: SET"). Local devs on macOS keep the podman default.
        run: make end2end-daemon CONTAINER_RT="$(command -v docker)"
      - name: Surface captured logs
        # Print the trap-captured compose logs + JUnit/JSON reports
        # inline so a reviewer can diagnose a failure straight from the
        # workflow log without downloading the artefact. Uses
        # `::group::` markers so the output is collapsible in the GHA
        # UI. Runs on success too — confirms logs were captured and
        # surfaces any healthy-but-noisy output worth noticing.
        if: always()
        run: |
          set +e
          REPORTS=source/end2end-tests/daemon/reports
          echo "::group::reports directory listing"
          ls -la "${REPORTS}" 2>&1 || echo "(reports directory missing)"
          echo "::endgroup::"
          for f in compose-ps.txt compose-logs.txt inspect.json junit.xml results.json; do
            path="${REPORTS}/${f}"
            if [ -s "${path}" ]; then
              echo "::group::${f}"
              cat "${path}"
              echo "::endgroup::"
            else
              echo "::warning::${path} missing or empty"
            fi
          done

      - name: Ensure Yarn cache directory exists
        # actions/setup-node saves the Yarn global cache in its post-step.
        # If make build-web exits early before any yarn install completes,
        # the cache folder may not exist and actions/cache will error with
        # "Path Validation Error". Creating it here (always, even on
        # failure) guarantees the post-step has a path to save.
        if: always()
        run: |
          CACHE_DIR=$(cd source/admin-site && yarn config get cacheFolder 2>/dev/null \
            || echo "$HOME/.yarn/berry/cache")
          mkdir -p "$CACHE_DIR"

      - name: Upload Vitest reports
        # Always upload, even on failure — the JUnit XML + compose
        # logs the trap captured are the primary debug surface.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: end2end-tests-daemon-reports
          path: source/end2end-tests/daemon/reports/
          retention-days: 7
          if-no-files-found: warn

  end2end-tests-ui:
    name: E2E Web UI Tests
    runs-on: ubuntu-latest
    # Builds the three frontends + a real-asset wardnetd-ui image (cargo
    # build inside Docker, ~7-10 min cold) before the Playwright run.
    timeout-minutes: 40
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Cache the three frontends' yarn installs (run on the host by
      # `make build-web`). The ui_runner package's own deps install
      # inside Docker and are served by the Docker layer cache.
      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - uses: ./.github/actions/setup-rust



      - name: Run web-ui e2e suite
        # `make e2e-ui` chains: build-web → image-test-ui (cargo build +
        # WEB_DIST=real embed inside Docker) → compose up → Playwright in
        # ui_runner → trap dumps compose logs into reports/ and tears the stack
        # down. Reports are written even on failure.
        # CONTAINER_RT=docker forces BuildKit (see the daemon job note).
        run: make e2e-ui CONTAINER_RT="$(command -v docker)"
      - name: Surface captured logs
        if: always()
        run: |
          set +e
          REPORTS=source/end2end-tests/web-ui/reports
          echo "::group::reports directory listing"
          ls -la "${REPORTS}" 2>&1 || echo "(reports directory missing)"
          echo "::endgroup::"
          for f in compose-ps.txt compose-logs.txt inspect.json junit.xml; do
            path="${REPORTS}/${f}"
            if [ -s "${path}" ]; then
              echo "::group::${f}"
              cat "${path}"
              echo "::endgroup::"
            else
              echo "::warning::${path} missing or empty"
            fi
          done

      - name: Ensure Yarn cache directory exists
        if: always()
        run: |
          CACHE_DIR=$(cd source/admin-site && yarn config get cacheFolder 2>/dev/null \
            || echo "$HOME/.yarn/berry/cache")
          mkdir -p "$CACHE_DIR"

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: end2end-tests-ui-reports
          path: source/end2end-tests/web-ui/reports/
          retention-days: 7
          if-no-files-found: warn
