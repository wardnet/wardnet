name: Coverage

# Reusable leaf for daemon + marketing-site + TS-frontend coverage.
#
# Called from ci-test.yml, the gt test stage. Each coverage job (daemon / site /
# frontend) is gated on a boolean input so the caller only spins up the
# work its change set touches — a frontend-only PR skips the 30-min daemon
# coverage, and vice versa. The parallel jobs each emit LCOV + JUnit.
#
# We only COMPUTE the reports. Everything downstream of that — the coverage
# gate, and the Codecov upload of both coverage AND test-results — belongs to
# bulwark (the `bulwark` job below), which we hand a codecov-token. It finds
# the reports in its working directory, where the artifact downloads put them.
# Doing any of it a second time here would just be a redundant Codecov push.

on:
  workflow_call:
    inputs:
      run-daemon:
        description: "Run the (expensive) Rust daemon coverage job."
        type: boolean
        default: false
      run-site:
        description: "Run marketing-site coverage."
        type: boolean
        default: false
      run-frontend:
        description: "Run the TS frontend (web + apps) coverage."
        type: boolean
        default: false
      run-go:
        description: "Run Go (wctl + SDK) coverage."
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional so fork PRs — which GitHub
          denies access to repo secrets — don't fail at the reusable-
          workflow validation step. When empty, codecov-action falls
          back to tokenless upload, accepted for unprotected (fork-
          prefixed) branch refs on public repos.
        required: false
      SEMGREP_APP_TOKEN:
        description: |
          Semgrep AppSec Platform token, passed to bulwark. Optional for
          the same fork-PR reason as CODECOV_TOKEN above — bulwark falls
          back to a local-only `semgrep scan` when empty.
        required: false

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller. This is the DEFAULT for jobs below
# that don't declare their own `permissions:` block — the `bulwark` job
# overrides it with contents:write/pull-requests:write (baseline caching +
# PR summary comment), which requires the caller (ci-test.yml
# `coverage:` job) to grant that same ceiling; every other job here stays
# read-only.
permissions:
  contents: read
  # site-coverage installs marketing-site, which pulls @wardnet/{brand,styles}
  # from GitHub Packages. Granted by the caller job (ci-test.yml) and surfaced here
  # so the leaf doesn't restrict it back to none.
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  daemon-coverage:
    name: Daemon coverage
    if: inputs.run-daemon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: source/daemon

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.75.21
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.75.21
        with:
          tool: cargo-nextest

      - name: Generate daemon coverage + test results
        # Single source of truth for the ignore regex lives in the
        # Makefile (`COV_IGNORE`). CI overrides COV_FMT to emit LCOV and
        # COV_RUNNER to drive nextest so we still get a JUnit alongside
        # the coverage report.
        #
        # The LCOV file must have "coverage" somewhere in its name: Codecov's
        # uploader auto-discovers reports via a fixed pattern list (*.lcov,
        # the exact name lcov.info, *coverage*.*, ...) and a name like
        # "daemon-lcov.info" matches none of them — "lcov" alone isn't enough,
        # only "coverage" or the .lcov extension are. That silently uploaded
        # zero coverage files for months while the codecov-token/permissions
        # all looked fine, which is why the badge sat on "unknown".
        run: |
          mkdir -p coverage
          make coverage-daemon \
            COV_RUNNER="nextest --profile ci" \
            COV_FMT="--lcov --output-path ../../coverage/daemon.coverage.info"
          cp source/daemon/target/nextest/ci/junit.xml coverage/daemon-junit.xml

      - name: Generate daemon coverage JSON report for bulwark
        # Reuses the profile data the step above already collected — see
        # coverage-daemon-report-json in the Makefile.
        run: make coverage-daemon-report-json

      - name: Upload daemon coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-daemon
          path: coverage/
          retention-days: 1

  site-coverage:
    name: Site coverage
    if: inputs.run-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "25"
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Generate site coverage + test results
        # marketing-site pulls @wardnet/{brand,styles} from GitHub Packages,
        # whose registry rejects anonymous reads. This job sets up Node/Yarn
        # directly (not via the setup-node-yarn action), so export GH_TOKEN —
        # which source/.yarnrc.yml reads — here. Packages are public, so the
        # default contents:read token suffices.
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd source/marketing-site && yarn install --immutable && yarn test:coverage

      - name: Collect into shared layout
        # coverage/pkg-summaries/<pkg>/ preserves the package-relative layout
        # bulwark's TS coverage auto-discovery expects (it reads
        # <pkgDir>/coverage/coverage-summary.json and, for patch coverage,
        # <pkgDir>/coverage/lcov.info in-place, not from a flag) — the
        # bulwark job restores these back to their original per-package
        # paths before invoking bulwark.
        run: |
          mkdir -p coverage
          cp source/marketing-site/coverage/lcov.info coverage/site.coverage.info
          cp source/marketing-site/test-results/junit.xml coverage/site-junit.xml
          mkdir -p coverage/pkg-summaries/marketing-site
          cp source/marketing-site/coverage/coverage-summary.json coverage/pkg-summaries/marketing-site/
          cp source/marketing-site/coverage/lcov.info coverage/pkg-summaries/marketing-site/

      - name: Upload site coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-site
          path: coverage/
          retention-days: 1

  frontend-coverage:
    name: Frontend coverage
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Generate frontend coverage + test results
        # Vitest across the four TS frontends (@wardnet/web + the three apps).
        # Each emits its own coverage/lcov.info and test-results/junit.xml.
        run: cd source && yarn turbo run test:coverage --filter=@wardnet/web --filter=@wardnet/admin-site --filter=@wardnet/admin-app --filter=@wardnet/user-app

      - name: Collect into shared layout
        # Each package's Vitest LCOV uses package-relative `SF:src/...` paths.
        # Prefix them with `source/<pkg>/` so the combined report maps to
        # unambiguous repo paths (four packages all have a `src/`), then
        # concatenate into one LCOV. JUnit files are copied per package.
        #
        # coverage/pkg-summaries/<pkg>/ preserves the package-relative layout
        # bulwark's TS coverage auto-discovery expects (it reads
        # <pkgDir>/coverage/coverage-summary.json and, for patch coverage,
        # <pkgDir>/coverage/lcov.info in-place, not from a flag) — the
        # bulwark job restores these back to their original per-package
        # paths before invoking bulwark. The lcov copied there is the
        # unprefixed per-package original, unlike the path-prefixed
        # concatenation above.
        run: |
          mkdir -p coverage
          : > coverage/frontend.coverage.info
          for pkg in web admin-site admin-app user-app; do
            lcov="source/$pkg/coverage/lcov.info"
            if [[ -f "$lcov" ]]; then
              sed -E "s#^SF:(src/)#SF:source/$pkg/\1#" "$lcov" >> coverage/frontend.coverage.info
            fi
            junit="source/$pkg/test-results/junit.xml"
            if [[ -f "$junit" ]]; then
              cp "$junit" "coverage/frontend-$pkg-junit.xml"
            fi
            summary="source/$pkg/coverage/coverage-summary.json"
            if [[ -f "$summary" ]]; then
              mkdir -p "coverage/pkg-summaries/$pkg"
              cp "$summary" "coverage/pkg-summaries/$pkg/"
            fi
            if [[ -f "$lcov" ]]; then
              mkdir -p "coverage/pkg-summaries/$pkg"
              cp "$lcov" "coverage/pkg-summaries/$pkg/"
            fi
          done

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 1

  go-coverage:
    name: Go coverage
    if: inputs.run-go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/wctl/go.mod
          cache-dependency-path: source/wctl/go.sum

      - name: Generate Go coverage profiles
        # One profile per module, written INSIDE the module it measures.
        # `go test -coverprofile` is module-scoped — run above a module and it
        # measures nothing — which is also why bulwark discovers each module
        # and reads `<moduleDir>/coverage.out` rather than expecting one file
        # at the scan root (wardnet/bulwark#28).
        #
        # Both modules run in one job: they merge into a single "go" pool, and
        # recording half of it as if it were the whole is what poisoned the
        # typescript baseline once (see the run-site/run-frontend note in
        # ci-test.yml).
        run: |
          set -euo pipefail
          for dir in source/wctl source/sdk/wardnet-go; do
            (cd "$dir" && go test ./... -covermode=set -coverprofile=coverage.out)
          done

      - name: Collect into shared layout
        # Keyed by module directory so the bulwark job can put each profile
        # back where its own module-relative candidate search looks for it.
        run: |
          set -euo pipefail
          mkdir -p coverage/go-profiles/wctl coverage/go-profiles/sdk-wardnet-go
          cp source/wctl/coverage.out coverage/go-profiles/wctl/coverage.out
          cp source/sdk/wardnet-go/coverage.out coverage/go-profiles/sdk-wardnet-go/coverage.out

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-go
          path: coverage/
          retention-days: 1

  bulwark:
    name: bulwark
    needs: [daemon-coverage, site-coverage, frontend-coverage, go-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run whenever at least one producer actually ran, so a partial
    # (path-filtered) PR still gets scanned.
    if: |
      always() && (
        needs.daemon-coverage.result == 'success' ||
        needs.site-coverage.result == 'success' ||
        needs.frontend-coverage.result == 'success' ||
        needs.go-coverage.result == 'success'
      )
    permissions:
      contents: write # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write # bulwark posts/updates a sticky PR summary comment
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # bulwark coverage needs full history to resolve the PR's base commit

      - name: Set up Go
        # bulwark's Go check `go install`s govulncheck, so the binary is built
        # with whatever Go is on PATH. govulncheck type-checks the code it
        # scans using the loader compiled into it, and a loader built with an
        # older Go rejects newer source outright:
        #
        #   golang.org/x/vuln@v1.6.0 requires go >= 1.25.0; switching to go1.25.12
        #   source/sdk/wardnet-go/auth.go:1:1: package requires newer Go version
        #     go1.26 (application built with go1.25)
        #
        # The runner's ambient Go is older than our modules' `go 1.26.0`, so
        # without this the scan fails on every Go module — not as a finding,
        # but as a loader error. Both modules are kept on the same Go version;
        # if they ever diverge this must track the newer of the two.
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/wctl/go.mod

      - name: Restore bulwark's own tool installs
        # bulwark installs cargo-audit/cargo-deny (compiled from source,
        # several minutes) and its pinned eslint toolchain into
        # ~/.cache/bulwark, keyed by tool version internally (see
        # wardnet/bulwark internal/rust's ensure() and internal/typescript's
        # ensureToolchain()) — a version bump gets its own subdirectory, so a
        # static key here is safe: it can only ever ADD entries for a new
        # version, never serve a stale one.
        #
        # restore/save are split (rather than one `actions/cache`) because the
        # combined action only saves on job SUCCESS. A failing scan would then
        # never populate the cache, so the tools would recompile on every run —
        # exactly when you least want a slow job. Saving with `if: always()`
        # breaks that chicken-and-egg.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: bulwark-cache
        with:
          path: ~/.cache/bulwark
          # The Go version is part of the key because bulwark keys its own tool
          # installs by tool version alone. A govulncheck built with an older Go
          # is indistinguishable from a good one by that key, so a cache entry
          # created before a Go bump would be served forever and keep failing to
          # load newer source.
          key: bulwark-tools-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}

      - name: Download daemon coverage
        if: needs.daemon-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-daemon
          path: coverage/

      - name: Download site coverage
        if: needs.site-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-site
          path: coverage/

      - name: Download frontend coverage
        if: needs.frontend-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-frontend
          path: coverage/

      - name: Download Go coverage
        if: needs.go-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-go
          path: coverage/

      - name: Restore per-package coverage reports for bulwark
        # Every language is staged at the path bulwark's auto-discovery already
        # searches, so nothing here is named again at the call site. bulwark
        # v1.7.0 removed the --rust-report/--rust-lcov-report/--tests-mode
        # inputs; coverage production is declared once in source/.bulwark.yml
        # as `coverage.source: report`, and the reports are found by convention.
        #
        # Rust needs BOTH exports. The llvm-cov JSON carries the aggregate
        # percentage and no per-line data at all, so without the lcov export
        # bulwark's patch gate reports the language as unmeasured while Codecov
        # happily grades the same diff from the lcov it auto-discovered — that
        # is how #957 got a green bulwark comment next to a red codecov/patch.
        #
        # All of it is skipped gracefully (file simply absent) when the
        # producing job didn't run — bulwark measures whatever is present.
        id: restore
        run: |
          set -euo pipefail
          # Rust: source/daemon is the only crate dir bulwark discovers, since
          # its Cargo.toml declares [workspace] and members under a workspace
          # ancestor are dropped. Its candidate lists are
          # coverage/llvm-cov.json and coverage/lcov.info relative to that dir,
          # which is why the JSON is renamed on the way in — the artifact's
          # own name is not one bulwark looks for.
          if [[ -f coverage/daemon-llvm-cov.json ]]; then
            mkdir -p source/daemon/coverage
            cp coverage/daemon-llvm-cov.json source/daemon/coverage/llvm-cov.json
          fi
          if [[ -f coverage/daemon.coverage.info ]]; then
            mkdir -p source/daemon/coverage
            cp coverage/daemon.coverage.info source/daemon/coverage/lcov.info
          fi
          # Go: each module's profile goes back inside that module, where
          # bulwark's per-module candidate search (coverage.out / cover.out /
          # c.out, relative to the module dir) finds it with no flag. Passing
          # --go-report would work too, but only as a keyed override per
          # module — the default lookup is simpler and stays correct if a
          # third module ever appears.
          if [[ -f coverage/go-profiles/wctl/coverage.out ]]; then
            cp coverage/go-profiles/wctl/coverage.out source/wctl/coverage.out
          fi
          if [[ -f coverage/go-profiles/sdk-wardnet-go/coverage.out ]]; then
            cp coverage/go-profiles/sdk-wardnet-go/coverage.out source/sdk/wardnet-go/coverage.out
          fi
          for pkg in web admin-site admin-app user-app marketing-site; do
            for file in coverage-summary.json lcov.info; do
              src="coverage/pkg-summaries/$pkg/$file"
              if [[ -f "$src" ]]; then
                mkdir -p "source/$pkg/coverage"
                cp "$src" "source/$pkg/coverage/$file"
              fi
            done
          done

      - uses: wardnet/bulwark@v2
        with:
          # `dir` is the only input left that concerns coverage: it is the scan
          # root, and bulwark must know the root before it can read the
          # .bulwark.yml that declares everything else.
          dir: source
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Save bulwark's tool installs
        # `if: always()` so a failing scan still populates the cache — see the
        # restore step above for why that matters. Skipped on an exact hit,
        # since there'd be nothing new to write.
        if: always() && steps.bulwark-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bulwark
          # Must match the restore key exactly, Go version included, or every
          # run would miss the cache and rebuild bulwark's tools from source.
          key: bulwark-tools-${{ runner.os }}-go${{ steps.setup-go.outputs.go-version }}
