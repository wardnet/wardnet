name: Coverage

# Reusable leaf for daemon + marketing-site + TS-frontend coverage.
#
# Called from pr.yml and ci.yml. Each coverage job (daemon / site /
# frontend) is gated on a boolean input so the caller only spins up the
# work its change set touches — a frontend-only PR skips the 30-min daemon
# coverage, and vice versa. The parallel jobs each emit LCOV + JUnit, and a
# single `upload` job combines everything into ONE Codecov invocation so we
# get a single PR comment with a coherent base comparison rather than
# dueling uploads from separate leaves.

on:
  workflow_call:
    inputs:
      run-daemon:
        description: "Run the (expensive) Rust daemon coverage job."
        type: boolean
        default: false
      run-site:
        description: "Run marketing-site coverage."
        type: boolean
        default: false
      run-frontend:
        description: "Run the TS frontend (web + apps) coverage."
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional so fork PRs — which GitHub
          denies access to repo secrets — don't fail at the reusable-
          workflow validation step. When empty, codecov-action falls
          back to tokenless upload, accepted for unprotected (fork-
          prefixed) branch refs on public repos.
        required: false
      SEMGREP_APP_TOKEN:
        description: |
          Semgrep AppSec Platform token, passed to bulwark. Optional for
          the same fork-PR reason as CODECOV_TOKEN above — bulwark falls
          back to a local-only `semgrep scan` when empty.
        required: false

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller. This is the DEFAULT for jobs below
# that don't declare their own `permissions:` block — the `bulwark` job
# overrides it with contents:write/pull-requests:write (baseline caching +
# PR summary comment), which requires the caller (pr.yml/ci.yml
# `coverage:` job) to grant that same ceiling; every other job here stays
# read-only.
permissions:
  contents: read
  # site-coverage installs marketing-site, which pulls @wardnet/{brand,styles}
  # from GitHub Packages. Granted by the caller job (pr.yml) and surfaced here
  # so the leaf doesn't restrict it back to none.
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  daemon-coverage:
    name: Daemon coverage
    if: inputs.run-daemon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source/daemon

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.75.21
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.75.21
        with:
          tool: cargo-nextest

      - name: Generate daemon coverage + test results
        # Single source of truth for the ignore regex lives in the
        # Makefile (`COV_IGNORE`). CI overrides COV_FMT to emit LCOV and
        # COV_RUNNER to drive nextest so we still get a JUnit alongside
        # the coverage report.
        run: |
          mkdir -p coverage
          make coverage-daemon \
            COV_RUNNER="nextest --profile ci" \
            COV_FMT="--lcov --output-path ../../coverage/daemon-lcov.info"
          cp source/daemon/target/nextest/ci/junit.xml coverage/daemon-junit.xml

      - name: Generate daemon coverage JSON report for bulwark
        # Reuses the profile data the step above already collected — see
        # coverage-daemon-report-json in the Makefile.
        run: make coverage-daemon-report-json

      - name: Upload daemon coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-daemon
          path: coverage/
          retention-days: 1

  site-coverage:
    name: Site coverage
    if: inputs.run-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25"
          cache: yarn
          cache-dependency-path: source/yarn.lock

      - name: Generate site coverage + test results
        # marketing-site pulls @wardnet/{brand,styles} from GitHub Packages,
        # whose registry rejects anonymous reads. This job sets up Node/Yarn
        # directly (not via the setup-node-yarn action), so export GH_TOKEN —
        # which source/.yarnrc.yml reads — here. Packages are public, so the
        # default contents:read token suffices.
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd source/marketing-site && yarn install --immutable && yarn test:coverage

      - name: Collect into shared layout
        # coverage/pkg-summaries/<pkg>/coverage-summary.json preserves the
        # package-relative layout bulwark's TS coverage auto-discovery
        # expects (it reads <pkgDir>/coverage/coverage-summary.json
        # in-place, not from a flag) — the bulwark job restores these back
        # to their original per-package paths before invoking bulwark.
        run: |
          mkdir -p coverage
          cp source/marketing-site/coverage/lcov.info coverage/site-lcov.info
          cp source/marketing-site/test-results/junit.xml coverage/site-junit.xml
          mkdir -p coverage/pkg-summaries/marketing-site
          cp source/marketing-site/coverage/coverage-summary.json coverage/pkg-summaries/marketing-site/

      - name: Upload site coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-site
          path: coverage/
          retention-days: 1

  frontend-coverage:
    name: Frontend coverage
    if: inputs.run-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Generate frontend coverage + test results
        # Vitest across the four TS frontends (@wardnet/web + the three apps).
        # Each emits its own coverage/lcov.info and test-results/junit.xml.
        run: cd source && yarn turbo run test:coverage --filter=@wardnet/web --filter=@wardnet/admin-site --filter=@wardnet/admin-app --filter=@wardnet/user-app

      - name: Collect into shared layout
        # Each package's Vitest LCOV uses package-relative `SF:src/...` paths.
        # Prefix them with `source/<pkg>/` so the combined report maps to
        # unambiguous repo paths (four packages all have a `src/`), then
        # concatenate into one LCOV. JUnit files are copied per package.
        #
        # coverage/pkg-summaries/<pkg>/coverage-summary.json preserves the
        # package-relative layout bulwark's TS coverage auto-discovery
        # expects (it reads <pkgDir>/coverage/coverage-summary.json
        # in-place, not from a flag) — the bulwark job restores these back
        # to their original per-package paths before invoking bulwark.
        run: |
          mkdir -p coverage
          : > coverage/frontend-lcov.info
          for pkg in web admin-site admin-app user-app; do
            lcov="source/$pkg/coverage/lcov.info"
            if [[ -f "$lcov" ]]; then
              sed -E "s#^SF:(src/)#SF:source/$pkg/\1#" "$lcov" >> coverage/frontend-lcov.info
            fi
            junit="source/$pkg/test-results/junit.xml"
            if [[ -f "$junit" ]]; then
              cp "$junit" "coverage/frontend-$pkg-junit.xml"
            fi
            summary="source/$pkg/coverage/coverage-summary.json"
            if [[ -f "$summary" ]]; then
              mkdir -p "coverage/pkg-summaries/$pkg"
              cp "$summary" "coverage/pkg-summaries/$pkg/"
            fi
          done

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: coverage/
          retention-days: 1

  bulwark:
    name: bulwark
    needs: [daemon-coverage, site-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same gating as `upload` below: run whenever at least one producer
    # actually ran, so a partial (path-filtered) PR still gets scanned.
    if: |
      always() && (
        needs.daemon-coverage.result == 'success' ||
        needs.site-coverage.result == 'success' ||
        needs.frontend-coverage.result == 'success'
      )
    permissions:
      contents: write # bulwark coverage caches baselines on the bulwark-state branch
      pull-requests: write # bulwark posts/updates a sticky PR summary comment
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # bulwark coverage needs full history to resolve the PR's base commit

      - name: Download daemon coverage
        if: needs.daemon-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-daemon
          path: coverage/

      - name: Download site coverage
        if: needs.site-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-site
          path: coverage/

      - name: Download frontend coverage
        if: needs.frontend-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-frontend
          path: coverage/

      - name: Restore per-package coverage reports for bulwark
        # bulwark's TS coverage auto-discovery reads
        # <pkgDir>/coverage/coverage-summary.json in-place (no flag), so the
        # downloaded pkg-summaries have to land back at their original
        # per-package paths. Rust coverage is a single explicit
        # --rust-report flag instead. Both are skipped gracefully (empty
        # rust-report output, package simply absent) when their producer
        # job didn't run — bulwark just measures whatever's present.
        id: restore
        run: |
          set -euo pipefail
          rust_report=""
          if [[ -f coverage/daemon-llvm-cov.json ]]; then
            mkdir -p source/daemon/coverage
            cp coverage/daemon-llvm-cov.json source/daemon/coverage/daemon-llvm-cov.json
            rust_report="daemon/coverage/daemon-llvm-cov.json"
          fi
          echo "rust-report=${rust_report}" >> "$GITHUB_OUTPUT"
          for pkg in web admin-site admin-app user-app marketing-site; do
            summary="coverage/pkg-summaries/$pkg/coverage-summary.json"
            if [[ -f "$summary" ]]; then
              mkdir -p "source/$pkg/coverage"
              cp "$summary" "source/$pkg/coverage/coverage-summary.json"
            fi
          done

      - uses: wardnet/bulwark@v1
        with:
          dir: source
          tests-mode: skip
          rust-report: ${{ steps.restore.outputs.rust-report }}
          codecov-token: ${{ secrets.CODECOV_TOKEN }}
          semgrep-app-token: ${{ secrets.SEMGREP_APP_TOKEN }}

  upload:
    name: Upload to Codecov
    needs: [daemon-coverage, site-coverage, frontend-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run even if one side failed so partial coverage still uploads —
    # a failing daemon test shouldn't hide a site coverage regression.
    if: |
      always() && (
        needs.daemon-coverage.result == 'success' ||
        needs.site-coverage.result == 'success' ||
        needs.frontend-coverage.result == 'success'
      )
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download daemon coverage
        if: needs.daemon-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-daemon
          path: coverage/

      - name: Download site coverage
        if: needs.site-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-site
          path: coverage/

      - name: Download frontend coverage
        if: needs.frontend-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-frontend
          path: coverage/

      - name: Resolve present coverage files
        id: files
        run: |
          set -euo pipefail
          LCOV=""
          JUNIT=""
          [[ -f coverage/daemon-lcov.info ]] && LCOV="${LCOV}coverage/daemon-lcov.info,"
          [[ -f coverage/site-lcov.info ]] && LCOV="${LCOV}coverage/site-lcov.info,"
          [[ -f coverage/frontend-lcov.info ]] && LCOV="${LCOV}coverage/frontend-lcov.info,"
          [[ -f coverage/daemon-junit.xml ]] && JUNIT="${JUNIT}coverage/daemon-junit.xml,"
          [[ -f coverage/site-junit.xml ]] && JUNIT="${JUNIT}coverage/site-junit.xml,"
          for f in coverage/frontend-*-junit.xml; do
            [[ -f "$f" ]] && JUNIT="${JUNIT}${f},"
          done
          echo "lcov=${LCOV%,}" >> $GITHUB_OUTPUT
          echo "junit=${JUNIT%,}" >> $GITHUB_OUTPUT

      # Pre-install the Codecov CLI from PyPI and hand it to both upload
      # steps via `binary:`. The default path (download from cli.codecov.io
      # + PGP verification against keybase.io) currently hangs until the
      # job timeout: Codecov migrated their keybase account, bricking the
      # old one and breaking signature verification — codecov/codecov-action#1956.
      # PyPI provides its own integrity, so this avoids the broken keybase
      # path WITHOUT `skip_validation` (which would disable integrity
      # checking outright). Revert to the action's own download once
      # upstream ships the fix.
      - name: Install Codecov CLI from PyPI
        id: codecovcli
        if: ${{ !cancelled() && (steps.files.outputs.lcov != '' || steps.files.outputs.junit != '') }}
        run: |
          python3 -m venv "$RUNNER_TEMP/codecov-cli-venv"
          "$RUNNER_TEMP/codecov-cli-venv/bin/pip" install --quiet codecov-cli
          echo "bin=$RUNNER_TEMP/codecov-cli-venv/bin/codecovcli" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.files.outputs.lcov != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.files.outputs.lcov }}
          binary: ${{ steps.codecovcli.outputs.bin }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.files.outputs.junit != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: ${{ steps.files.outputs.junit }}
          binary: ${{ steps.codecovcli.outputs.bin }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
