name: Coverage

# Reusable leaf for daemon + bridge + site coverage.
#
# Called only from pr.yml (coverage doesn't run on push-to-main —
# Codecov's patch-coverage feature keys off PRs). Daemon, bridge, and
# site coverage run in parallel jobs, and a single `upload` job combines
# all LCOV/JUnit files into ONE Codecov invocation per PR so we get a
# single PR comment with a coherent base comparison rather than
# dueling uploads from separate leaves.

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: |
          Codecov upload token. Optional so fork PRs — which GitHub
          denies access to repo secrets — don't fail at the reusable-
          workflow validation step. When empty, codecov-action falls
          back to tokenless upload, accepted for unprotected (fork-
          prefixed) branch refs on public repos.
        required: false

# Explicit scopes (not read-all) so this leaf's workflow-level stays a
# subset of the caller's workflow-level — GitHub's reusable-workflow
# permission rules reject leaf > caller.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  daemon-coverage:
    name: Daemon coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source/daemon

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.75.21
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.75.21
        with:
          tool: cargo-nextest

      - name: Generate daemon coverage + test results
        # Single source of truth for the ignore regex lives in the
        # Makefile (`COV_IGNORE`). CI overrides COV_FMT to emit LCOV and
        # COV_RUNNER to drive nextest so we still get a JUnit alongside
        # the coverage report.
        run: |
          mkdir -p coverage
          make coverage-daemon \
            COV_RUNNER="nextest --profile ci" \
            COV_FMT="--lcov --output-path ../../coverage/daemon-lcov.info"
          cp source/daemon/target/nextest/ci/junit.xml coverage/daemon-junit.xml

      - name: Upload daemon coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-daemon
          path: coverage/
          retention-days: 1

  bridge-coverage:
    name: Bridge coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
        with:
          toolchain: "1.96"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: source/bridge

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.75.21
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e # v2.75.21
        with:
          tool: cargo-nextest

      - name: Generate bridge coverage + test results
        env:
          BRIDGE_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306
        run: |
          mkdir -p coverage
          make coverage-bridge-ci \
            COV_FMT="--lcov --output-path ../../coverage/bridge-lcov.info"
          cp source/bridge/target/nextest/ci/junit.xml coverage/bridge-junit.xml

      - name: Upload bridge coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-bridge
          path: coverage/
          retention-days: 1

  site-coverage:
    name: Site coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "25"
          cache: yarn
          cache-dependency-path: source/marketing-site/yarn.lock

      - name: Generate site coverage + test results
        run: cd source/marketing-site && yarn install --immutable && yarn test:coverage

      - name: Collect into shared layout
        run: |
          mkdir -p coverage
          cp source/marketing-site/coverage/lcov.info coverage/site-lcov.info
          cp source/marketing-site/test-results/junit.xml coverage/site-junit.xml

      - name: Upload site coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-site
          path: coverage/
          retention-days: 1

  upload:
    name: Upload to Codecov
    needs: [daemon-coverage, bridge-coverage, site-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Run even if one side failed so partial coverage still uploads —
    # a failing daemon test shouldn't hide a bridge or site coverage regression.
    if: |
      always() && (
        needs.daemon-coverage.result == 'success' ||
        needs.bridge-coverage.result == 'success' ||
        needs.site-coverage.result == 'success'
      )
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download daemon coverage
        if: needs.daemon-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-daemon
          path: coverage/

      - name: Download bridge coverage
        if: needs.bridge-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-bridge
          path: coverage/

      - name: Download site coverage
        if: needs.site-coverage.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-site
          path: coverage/

      - name: Resolve present coverage files
        id: files
        run: |
          set -euo pipefail
          LCOV=""
          JUNIT=""
          [[ -f coverage/daemon-lcov.info ]] && LCOV="${LCOV}coverage/daemon-lcov.info,"
          [[ -f coverage/bridge-lcov.info ]] && LCOV="${LCOV}coverage/bridge-lcov.info,"
          [[ -f coverage/site-lcov.info ]] && LCOV="${LCOV}coverage/site-lcov.info,"
          [[ -f coverage/daemon-junit.xml ]] && JUNIT="${JUNIT}coverage/daemon-junit.xml,"
          [[ -f coverage/bridge-junit.xml ]] && JUNIT="${JUNIT}coverage/bridge-junit.xml,"
          [[ -f coverage/site-junit.xml ]] && JUNIT="${JUNIT}coverage/site-junit.xml,"
          echo "lcov=${LCOV%,}" >> $GITHUB_OUTPUT
          echo "junit=${JUNIT%,}" >> $GITHUB_OUTPUT

      # Pre-install the Codecov CLI from PyPI and hand it to both upload
      # steps via `binary:`. The default path (download from cli.codecov.io
      # + PGP verification against keybase.io) currently hangs until the
      # job timeout: Codecov migrated their keybase account, bricking the
      # old one and breaking signature verification — codecov/codecov-action#1956.
      # PyPI provides its own integrity, so this avoids the broken keybase
      # path WITHOUT `skip_validation` (which would disable integrity
      # checking outright). Revert to the action's own download once
      # upstream ships the fix.
      - name: Install Codecov CLI from PyPI
        id: codecovcli
        if: ${{ !cancelled() && (steps.files.outputs.lcov != '' || steps.files.outputs.junit != '') }}
        run: |
          python3 -m venv "$RUNNER_TEMP/codecov-cli-venv"
          "$RUNNER_TEMP/codecov-cli-venv/bin/pip" install --quiet codecov-cli
          echo "bin=$RUNNER_TEMP/codecov-cli-venv/bin/codecovcli" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        if: steps.files.outputs.lcov != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ${{ steps.files.outputs.lcov }}
          binary: ${{ steps.codecovcli.outputs.bin }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.files.outputs.junit != '' }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          files: ${{ steps.files.outputs.junit }}
          binary: ${{ steps.codecovcli.outputs.bin }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
