name: CI

# Orchestrator for pushes to `main`.
#
# Composes the same reusable leaves as pr.yml but skips the PR-only
# gates (coverage, tests-e2e). Coverage runs only on PR because
# Codecov's patch-coverage + PR-comment flow is PR-keyed; running it
# on push-to-main would just produce uncommented uploads.
#
# Structure:
#   preflight     — detect-changes + check-version composite actions
#                   in a single job (outputs gate the leaves below)
#   build-daemon  — lint + tests + release build + artifacts (gated)
#   build-site    — lint + release build + artifact (gated)
#
# Site deploy happens ONLY on release.yml (on tag push) — marketing
# content ships in lockstep with daemon releases, not on every
# main commit.

on:
  push:
    branches: [main]

# Workflow-level permissions stay read-only. Each job/leaf elevates
# to the writes it actually needs via its own `permissions:` block —
# Scorecard's Token-Permissions check rewards this scoping.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      daemon: ${{ steps.detect.outputs.daemon }}
      bridge: ${{ steps.detect.outputs.bridge }}
      site: ${{ steps.detect.outputs.site }}
      admin-web: ${{ steps.detect.outputs.admin-web }}
      admin-app: ${{ steps.detect.outputs.admin-app }}
      user-app: ${{ steps.detect.outputs.user-app }}
      ci: ${{ steps.detect.outputs.ci }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: ./.github/actions/detect-changes
        id: detect
      # Runs after detect because check-version is cheaper to rerun
      # (3-4 s) than pays the VM spin-up cost of its own job.
      - uses: ./.github/actions/check-version

  build-daemon:
    name: Build Daemon
    needs: preflight
    if: needs.preflight.outputs.daemon == 'true' || needs.preflight.outputs.ci == 'true'
    # build-daemon.yml's `check-daemon` job uploads clippy SARIF to
    # Code Scanning — it needs `security-events: write` granted by the
    # caller. Scoped here (not at workflow-level) so the rest of the
    # run stays read-only.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/build-daemon.yml
    secrets: inherit

  build-bridge:
    name: Build Bridge
    needs: preflight
    if: >
      needs.preflight.outputs.bridge == 'true' ||
      needs.preflight.outputs.ci == 'true' ||
      github.event_name == 'pull_request'
    # check-bridge uploads clippy SARIF to Code Scanning — it needs
    # `security-events: write` granted by the caller. Scoped here so the
    # rest of the run stays read-only.
    # Always runs on pull_request events so Code Scanning always has a
    # rust-clippy-bridge analysis to compare against main, preventing the
    # "configuration not found" warning even when bridge code is unchanged.
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/build-bridge.yml
    secrets: inherit

  build-site:
    name: Build Site
    needs: preflight
    if: needs.preflight.outputs.site == 'true' || needs.preflight.outputs.ci == 'true'
    uses: ./.github/workflows/build-site.yml
    secrets: inherit

  build-admin-web:
    name: Build Admin Web
    needs: preflight
    if: needs.preflight.outputs['admin-web'] == 'true' || needs.preflight.outputs.ci == 'true'
    uses: ./.github/workflows/build-admin-web.yml
    secrets: inherit

  build-admin-app:
    name: Build Admin App
    needs: preflight
    if: needs.preflight.outputs['admin-app'] == 'true' || needs.preflight.outputs.ci == 'true'
    uses: ./.github/workflows/build-admin-app.yml
    secrets: inherit

  build-user-app:
    name: Build User App
    needs: preflight
    if: needs.preflight.outputs['user-app'] == 'true' || needs.preflight.outputs.ci == 'true'
    uses: ./.github/workflows/build-user-app.yml
    secrets: inherit

  tests-e2e:
    name: E2E Tests
    needs: preflight
    # Push-to-main parity with pr.yml — daemon or CI changes trigger
    # the full e2e gauntlet. Coverage stays PR-only (Codecov's
    # PR-comment flow has nothing to land on for push-to-main).
    if: needs.preflight.outputs.daemon == 'true' || needs.preflight.outputs.ci == 'true'
    uses: ./.github/workflows/tests-e2e.yml
    secrets: inherit
