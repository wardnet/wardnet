name: CI

# Orchestrator for pushes to `main`.
#
# Composes the same reusable leaves as pr.yml. Coverage ALSO runs here
# (push-to-main) so Codecov records a report for the merged main commit —
# that default-branch upload is what advances the coverage number/badge
# and gives later PRs an accurate base to diff against. Without it (main
# is squash-merged, so PR-head reports are never main ancestors) the
# default-branch number freezes. Patch-coverage and the PR comment stay
# PR-only — a push has no PR to land them on, which is fine.
#
# Structure:
#   preflight     — detect-changes + check-version composite actions
#                   in a single job (outputs gate the leaves below)
#   build-daemon  — lint + tests + release build + artifacts (gated)
#   build-site    — lint + release build + artifact (gated)
#
# Site deploy happens ONLY on release.yml (on tag push) — marketing
# content ships in lockstep with daemon releases, not on every
# main commit.

on:
  push:
    branches: [main]

# Workflow-level permissions stay read-only. Each job/leaf elevates
# to the writes it actually needs via its own `permissions:` block —
# Scorecard's Token-Permissions check rewards this scoping.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      daemon: ${{ steps.detect.outputs.daemon }}
      site: ${{ steps.detect.outputs.site }}
      admin-web: ${{ steps.detect.outputs.admin-web }}
      admin-app: ${{ steps.detect.outputs.admin-app }}
      user-app: ${{ steps.detect.outputs.user-app }}
      ci: ${{ steps.detect.outputs.ci }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: ./.github/actions/detect-changes
        id: detect
      # Runs after detect because check-version is cheaper to rerun
      # (3-4 s) than pays the VM spin-up cost of its own job.
      - uses: ./.github/actions/check-version

  build-daemon:
    name: Build Daemon
    needs: preflight
    if: needs.preflight.outputs.daemon == 'true' || needs.preflight.outputs.ci == 'true'
    # build-daemon.yml's `check-daemon` job uploads clippy SARIF to
    # Code Scanning — it needs `security-events: write` granted by the
    # caller. Scoped here (not at workflow-level) so the rest of the
    # run stays read-only.
    permissions:
      contents: read
      actions: read
      security-events: write
      # build-web reads @wardnet/* from GitHub Packages.
      packages: read
    uses: ./.github/workflows/build-daemon.yml
    secrets: inherit

  build-site:
    name: Build Site
    needs: preflight
    if: needs.preflight.outputs.site == 'true' || needs.preflight.outputs.ci == 'true'
    # Read @wardnet/{brand,styles} from GitHub Packages during yarn install.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-site.yml
    secrets: inherit

  build-admin-web:
    name: Build Admin Web
    needs: preflight
    if: needs.preflight.outputs['admin-web'] == 'true' || needs.preflight.outputs.ci == 'true'
    # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-admin-web.yml
    secrets: inherit

  build-admin-app:
    name: Build Admin App
    needs: preflight
    if: needs.preflight.outputs['admin-app'] == 'true' || needs.preflight.outputs.ci == 'true'
    # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-admin-app.yml
    secrets: inherit

  build-user-app:
    name: Build User App
    needs: preflight
    if: needs.preflight.outputs['user-app'] == 'true' || needs.preflight.outputs.ci == 'true'
    # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build-user-app.yml
    secrets: inherit

  coverage:
    name: Coverage
    needs: preflight
    # Default-branch coverage upload so the Codecov number/badge advances on
    # every merge. NO bot-author skip here (unlike pr.yml): that skip exists
    # because `pull_request` events from same-repo bot branches get no repo
    # secrets, so CODECOV_TOKEN is absent. A `push` to main is a trusted event
    # that DOES receive secrets regardless of who authored the merge, so the
    # token is always present. And this runs post-merge with non-fatal uploads
    # (`fail_ci_if_error: false`), so it can neither block a merge nor go red
    # from an upload hiccup.
    if: >
      needs.preflight.outputs.daemon == 'true' ||
      needs.preflight.outputs.site == 'true' ||
      needs.preflight.outputs['admin-web'] == 'true' ||
      needs.preflight.outputs['admin-app'] == 'true' ||
      needs.preflight.outputs['user-app'] == 'true' ||
      needs.preflight.outputs.ci == 'true'
    # site-coverage reads @wardnet/{brand,styles} from GitHub Packages.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/coverage.yml
    # Gate each coverage job on the relevant change bucket (see pr.yml).
    with:
      run-daemon: ${{ needs.preflight.outputs.daemon == 'true' || needs.preflight.outputs.ci == 'true' }}
      run-site: ${{ needs.preflight.outputs.site == 'true' || needs.preflight.outputs.ci == 'true' }}
      run-frontend: ${{ needs.preflight.outputs['admin-web'] == 'true' || needs.preflight.outputs['admin-app'] == 'true' || needs.preflight.outputs['user-app'] == 'true' || needs.preflight.outputs.ci == 'true' }}
    secrets: inherit

  tests-e2e:
    name: E2E Tests
    needs: preflight
    # Push-to-main parity with pr.yml — daemon or CI changes trigger
    # the full e2e gauntlet.
    if: needs.preflight.outputs.daemon == 'true' || needs.preflight.outputs.ci == 'true'
    # build-web (run on the host before the Docker build) reads @wardnet/*
    # from GitHub Packages.
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/tests-e2e.yml
    secrets: inherit
