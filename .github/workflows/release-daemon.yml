name: Release Daemon

# Reusable leaf that turns build-daemon.yml's unsigned artifacts into a
# published GitHub Release: rename to include the version, sha256, sign
# with minisign, verify the signature against the committed pubkey,
# and attach to a `gh release create` call.
#
# The wardnetd-mock artifact is deliberately NOT attached — it's a
# dev/test tool, not a shipped binary.

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version (e.g. `0.2.1`, `0.2.1-beta.1`).
        type: string
        required: true
      tag:
        description: Git tag (e.g. `v0.2.1`).
        type: string
        required: true
      prerelease:
        description: Mark as pre-release on GitHub.
        type: boolean
        required: true
      notes-body:
        description: >
          Literal release body. When empty (default), notes come from
          docs/releases/v<version>.md, falling back to GitHub's auto-generated
          notes. Edge builds pass a fixed one-liner: they carry no notes doc,
          and auto-generated "changes since the last tag" is meaningless for a
          build cut off an arbitrary branch.
        type: string
        default: ""
      attach-openapi:
        description: >
          Attach docs/openapi.json + its sha256 to the release. Edge builds
          pass `false`: they do not regenerate the spec (ADR-0023), so the
          committed one may not describe the binary being published, and
          publishing it anyway would feed a wrong spec into the docs site's
          version picker, which dedupes historical specs by hash.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # `contents: write` scoped to this job — needed by `gh release
      # create`. Top-level stays read-only so Scorecard's
      # Token-Permissions check doesn't flag the workflow.
      contents: write
      # OIDC token + attestation upload for `actions/attest-build-provenance`.
      # Keyless Sigstore signing binds each artefact to this workflow file,
      # ref, and commit SHA — Scorecard's Signed-Releases check looks for
      # this in addition to the minisign signature.
      id-token: write
      attestations: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download wardnetd x86_64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wardnetd-x86_64-unsigned
          path: release-staging/

      - name: Download wardnetd aarch64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wardnetd-aarch64-unsigned
          path: release-staging/

      - name: Sign post-upgrade payload, repack, rename, sha256, sign tarball
        env:
          VERSION: ${{ inputs.version }}
          MINISIGN_KEY: ${{ secrets.WARDNET_MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.WARDNET_MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${MINISIGN_KEY:-}" || -z "${MINISIGN_PASSWORD:-}" ]]; then
            echo "::error::WARDNET_MINISIGN_KEY and WARDNET_MINISIGN_PASSWORD secrets are required. See deploy/keys/README.md."
            exit 1
          fi

          sudo apt-get update && sudo apt-get install -y minisign

          cd release-staging

          # Write the encrypted private key once. Shredded in the
          # trailing step regardless of earlier failure.
          #
          # The secret is shared with other repos, which consume the key file
          # verbatim, so it is stored raw. Historically it was base64-encoded.
          # Accept either: a raw minisign key always opens with the "untrusted
          # comment:" header, anything else is treated as base64.
          if [[ "${MINISIGN_KEY}" == untrusted\ comment:* ]]; then
            printf '%s\n' "${MINISIGN_KEY}" > minisign.key
          else
            printf '%s' "${MINISIGN_KEY}" | base64 -d > minisign.key
          fi
          chmod 0600 minisign.key
          trap 'shred -u minisign.key || true' EXIT

          # Fail with a diagnosable message rather than letting minisign report
          # a generic parse error several steps later.
          if ! head -n1 minisign.key | grep -q '^untrusted comment:'; then
            echo "::error::WARDNET_MINISIGN_KEY is neither a raw minisign key nor valid base64 of one. See deploy/keys/README.md."
            exit 1
          fi

          for ARCH in x86_64 aarch64; do
            # build-daemon.yml ships the tarball with `wardnet-postupgrade`
            # unsigned alongside `wardnetd` + `wardnet-postupgrade-runner`
            # + `wardnet-postupgrade.service`. Two-step signing here:
            #   1. Sign the postupgrade binary with the same release key
            #      and rename it to `.bin` so the runtime trust anchor
            #      finds it under the expected name.
            #   2. Re-sign the outer tarball with the signed pair in
            #      place. install.sh + the auto-updater verify the
            #      tarball signature; the runner verifies the inner
            #      .bin/.minisig pair. Defence in depth.
            SRC="wardnetd-${ARCH}.tar.gz"
            WORK="staged-${ARCH}"
            mkdir -p "${WORK}"
            tar -C "${WORK}" -xzf "${SRC}"
            rm "${SRC}"

            mv "${WORK}/wardnet-postupgrade" "${WORK}/wardnet-postupgrade.bin"

            printf '%s\n' "${MINISIGN_PASSWORD}" | \
              MINISIGN_PASSWORD="${MINISIGN_PASSWORD}" minisign -Sm "${WORK}/wardnet-postupgrade.bin" \
                -s minisign.key \
                -t "wardnet-postupgrade ${VERSION} (${ARCH})" \
                -c "Wardnet release signing key" \
                -x "${WORK}/wardnet-postupgrade.minisig"

            minisign -Vm "${WORK}/wardnet-postupgrade.bin" \
              -p "../deploy/keys/wardnet-release.pub" \
              -x "${WORK}/wardnet-postupgrade.minisig"

            tar -C "${WORK}" -czf "${SRC}" \
              wardnetd \
              wardnet-postupgrade-runner \
              wardnet-postupgrade.bin \
              wardnet-postupgrade.minisig \
              wardnet-postupgrade.service
            rm -rf "${WORK}"

            # Versioned filename for end-user clarity and the daemon's
            # auto-updater, which builds the URL as
            # `wardnetd-<version>-<arch>.tar.gz`.
            DST="wardnetd-${VERSION}-${ARCH}.tar.gz"
            mv "${SRC}" "${DST}"

            sha256sum "${DST}" | awk '{print $1}' > "${DST}.sha256"

            # Feed password both via stdin and env — older minisigns
            # fall back to stdin, newer honour MINISIGN_PASSWORD.
            # GitHub runners have no tty, so env-only doesn't always
            # work.
            printf '%s\n' "${MINISIGN_PASSWORD}" | \
              MINISIGN_PASSWORD="${MINISIGN_PASSWORD}" minisign -Sm "${DST}" \
                -s minisign.key \
                -t "wardnetd ${VERSION} (${ARCH})" \
                -c "Wardnet release signing key" \
                -x "${DST}.minisig"

            # Sanity check against the committed public key.
            minisign -Vm "${DST}" \
              -p "../deploy/keys/wardnet-release.pub" \
              -x "${DST}.minisig"
          done

          ls -l

      - name: Stage OpenAPI spec + sha256
        # Published alongside the binary so external consumers can
        # download the spec for a specific daemon version without
        # running the daemon. The site's manifest generator dedupes
        # across historical releases using the .sha256.
        if: inputs.attach-openapi
        run: |
          set -euo pipefail
          cp docs/openapi.json release-staging/openapi.json
          sha256sum release-staging/openapi.json | awk '{print $1}' \
            > release-staging/openapi.json.sha256

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/wctl/go.mod
          cache-dependency-path: source/wctl/go.sum

      - name: Build wctl binaries + checksums
        # `wctl self-update` and scripts/install.sh both resolve
        # `wctl_<version>_<os>_<arch>` and `checksums.txt` from this release,
        # so the asset names below are a contract with those two callers —
        # renaming them breaks every installed CLI's self-update.
        #
        # Static binaries (CGO_ENABLED=0): the CLI only speaks HTTP, and a
        # cgo build would pin it to the runner's glibc and fail on musl or
        # older distros.
        env:
          VERSION: ${{ inputs.version }}
        working-directory: source/wctl
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/release-staging"

          for PLATFORM in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${PLATFORM%/*}"
            GOARCH="${PLATFORM#*/}"
            ASSET="wctl_${VERSION}_${GOOS}_${GOARCH}"
            echo "building ${ASSET}"
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
                -o "${OUT}/${ASSET}" ./cmd/wctl
          done

          # install.sh reads this with `awk '$2 == asset'`, so the plain
          # `<sha256>  <name>` sha256sum format is what it expects. Generate
          # from inside the directory so no path prefix reaches the names.
          cd "${OUT}"
          sha256sum wctl_"${VERSION}"_* > checksums.txt
          cat checksums.txt

          # Published under a wctl-specific name: the *daemon* installer is
          # the one users know as install.sh (served at wardnet.network),
          # and two assets called install.sh would be a coin flip.
          cp "${GITHUB_WORKSPACE}/source/wctl/scripts/install.sh" wctl-install.sh

      - name: Attest SLSA build provenance (wctl binaries)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-staging/wctl_*

      - name: Attest SLSA build provenance
        # Keyless Sigstore signing — binds each subject to this workflow
        # file, ref, and commit SHA. Attestations surface under the
        # release's "Attestations" tab on GitHub and are verifiable via
        # `gh attestation verify`. Complements the minisign signature:
        # minisign anchors authenticity even without GitHub; provenance
        # proves build integrity even if the minisign key is rotated.
        #
        # Edge builds are attested too: they are unreviewed, but they are
        # not unauthentic — provenance is exactly what proves an edge
        # tarball came from this workflow and not from someone's laptop.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-staging/*.tar.gz

      - name: Attest SLSA build provenance (OpenAPI spec)
        if: inputs.attach-openapi
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-staging/openapi.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_BODY: ${{ inputs.notes-body }}
          ATTACH_OPENAPI: ${{ inputs.attach-openapi }}
        run: |
          set -euo pipefail
          ARGS=(--verify-tag --title "Wardnet ${VERSION}")

          if [[ -n "${NOTES_BODY}" ]]; then
            # Caller supplied the body verbatim (edge builds).
            ARGS+=(--notes "${NOTES_BODY}")
          else
            # Prefer hand-written release notes at docs/releases/vX.Y.Z.md.
            # Fall back to GitHub's auto-generated notes (diff since last tag).
            NOTES_FILE="docs/releases/v${VERSION}.md"
            if [[ -f "${NOTES_FILE}" ]]; then
              echo "Using release notes from ${NOTES_FILE}"
              ARGS+=(--notes-file "${NOTES_FILE}")
            else
              echo "No ${NOTES_FILE} found — falling back to auto-generated notes"
              ARGS+=(--generate-notes)
            fi
          fi

          if [[ "${PRERELEASE}" == "true" ]]; then
            ARGS+=(--prerelease)
          fi

          ASSETS=(
            release-staging/*.tar.gz
            release-staging/*.tar.gz.sha256
            release-staging/*.tar.gz.minisig
            release-staging/wctl_*
            release-staging/checksums.txt
            release-staging/wctl-install.sh
          )
          if [[ "${ATTACH_OPENAPI}" == "true" ]]; then
            ASSETS+=(
              release-staging/openapi.json
              release-staging/openapi.json.sha256
            )
          fi

          gh release create "${TAG}" "${ARGS[@]}" "${ASSETS[@]}"
