name: Deploy Site

# Reusable leaf for GitHub Pages deployment.
#
# Downloads a pre-built site bundle (produced by build-site.yml) and
# publishes it. No build step here — deploy-site.yml is strictly about
# shipping, so `bundle-artifact` is a required input.
#
# Callers: release.yml (on every tag) and deploy-site-manual.yml
# (off-cycle, on demand). Manual redeploy:
# `gh workflow run deploy-site-manual.yml`.

on:
  workflow_call:
    inputs:
      bundle-artifact:
        description: Artifact name produced by build-site.yml.
        type: string
        default: site-dist

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      # `pages: write` + `id-token: write` scoped to this job — needed
      # by actions/deploy-pages. Top-level stays read-only so
      # Scorecard's Token-Permissions check doesn't flag the workflow.
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Download site bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.bundle-artifact }}
          path: site/

      - name: Upload as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
