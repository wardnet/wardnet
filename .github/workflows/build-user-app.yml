name: Build User App

# Reusable leaf for user-app (user PWA) type-check and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/user-app/**, source/wardnet-web/**,
# source/admin-site/forge-web/**, or source/sdk/wardnet-js/** — all are
# portal dependencies that user-app resolves at build time.
#
# Produces no artifact: the daemon compilation rebuilds all web apps via
# `make build-web`, so there is no downstream consumer for a standalone
# user-app dist. This workflow validates that the app type-checks and builds
# cleanly on every relevant change.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-user-app:
    name: Check user-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/user-app/yarn.lock

      - name: Install deps
        run: cd source/user-app && yarn install --immutable

      - name: Type check
        run: cd source/user-app && yarn type-check

  build:
    name: Build user-app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/user-app/yarn.lock
          build-command: cd source/user-app && yarn install --immutable && yarn build
