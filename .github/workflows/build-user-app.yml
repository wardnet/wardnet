name: Build User App

# Reusable leaf for user-app (user PWA) type-check and production build.
#
# Callers: ci.yml (push to main), pr.yml (PRs).
# Triggered by changes to source/user-app/**, source/web/**, or
# source/sdk/wardnet-js/** — all are portal dependencies that user-app
# resolves at build time.
#
# Produces no artifact: the daemon compilation rebuilds all web apps via
# `make build-web`, so there is no downstream consumer for a standalone
# user-app dist. This workflow validates that the app type-checks and builds
# cleanly on every relevant change.

on:
  workflow_call:

permissions:
  contents: read
  # Read @wardnet/{ui,styles,brand} from GitHub Packages during yarn install.
  # Granted by the caller job (pr.yml/ci.yml) and surfaced here so the leaf
  # doesn't restrict it back to none.
  packages: read

jobs:
  check-user-app:
    name: Check user-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/setup-node-yarn
        with:
          cache-dependency-path: source/yarn.lock

      - name: Install deps
        run: cd source && yarn install --immutable

      - name: Type check
        run: cd source && yarn turbo run type-check --filter=@wardnet/user-app

      - name: Test
        run: cd source && yarn turbo run test --filter=@wardnet/user-app

  build:
    name: Build user-app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: ./.github/actions/build-vite-app
        with:
          cache-dependency-path: source/yarn.lock
          build-command: cd source && yarn install --immutable && yarn turbo run build --filter=@wardnet/user-app
